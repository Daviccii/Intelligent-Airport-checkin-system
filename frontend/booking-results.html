<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Results - SmartFly Airways</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brand-primary: #667eea;
            --brand-secondary: #0a2463;
            --brand-accent: #f39c12;
            --muted: #666;
            --bg-light: #f8f9fa;
            --bg-white: #ffffff;
            --border: #e6e9ef;
            --success: #10b981;
            --error: #dc3545;
            --shadow-sm: 0 2px 8px rgba(10, 36, 99, 0.08);
            --shadow-md: 0 6px 20px rgba(10, 36, 99, 0.12);
            --shadow-lg: 0 12px 32px rgba(10, 36, 99, 0.18);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #0a2463 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, rgba(10, 36, 99, 0.95) 0%, rgba(102, 126, 234, 0.95) 100%);
            color: white;
            padding: 40px 24px;
            text-align: center;
            border-radius: 16px 16px 0 0;
            position: relative;
            overflow: hidden;
            margin: -40px -20px 40px -20px;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><path d="M50 10 L60 40 L50 70 L40 40 Z" fill="rgba(255,255,255,0.05)"/></svg>') repeat;
            opacity: 0.3;
        }

        .header-content {
            position: relative;
            z-index: 1;
        }

        .header h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.95;
            margin-bottom: 24px;
        }

        .search-summary {
            background: rgba(255, 255, 255, 0.15);
            padding: 16px 24px;
            border-radius: 8px;
            font-size: 14px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Main Container */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 0 0 16px 16px;
            padding: 40px;
            box-shadow: var(--shadow-lg);
        }

        /* Results Count */
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 2px solid var(--bg-light);
        }

        .results-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--brand-secondary);
        }

        .results-count {
            background: var(--brand-primary);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
        }

        /* Booking Cards */
        .bookings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .booking-card {
            background: white;
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .booking-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--brand-primary) 0%, var(--brand-accent) 100%);
        }

        .booking-card:hover {
            border-color: var(--brand-primary);
            box-shadow: var(--shadow-lg);
            transform: translateY(-4px);
        }

        /* Card Header */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .passenger-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--brand-secondary);
        }

        .booking-ref-badge {
            background: var(--bg-light);
            color: var(--brand-primary);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: 'Courier New', monospace;
        }

        /* Flight Info */
        .flight-route {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            padding: 16px 0;
            border-top: 1px solid var(--bg-light);
            border-bottom: 1px solid var(--bg-light);
        }

        .airport-code {
            font-size: 20px;
            font-weight: 700;
            color: var(--brand-secondary);
            text-align: center;
            min-width: 50px;
        }

        .route-line {
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--brand-primary), transparent);
            position: relative;
        }

        .route-line::after {
            content: '✈';
            position: absolute;
            right: -8px;
            top: -14px;
            color: var(--brand-primary);
            font-size: 16px;
        }

        /* Card Details */
        .card-details {
            font-size: 14px;
            color: var(--muted);
            line-height: 1.8;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .detail-label {
            font-weight: 600;
            color: var(--brand-secondary);
        }

        .detail-value {
            text-align: right;
        }

        /* Action Button */
        .view-button {
            width: 100%;
            padding: 12px 20px;
            margin-top: 20px;
            background: linear-gradient(135deg, var(--brand-primary) 0%, #667eea 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .view-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .view-button:active {
            transform: translateY(0);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 40px;
        }

        .empty-icon {
            font-size: 64px;
            color: var(--muted);
            margin-bottom: 20px;
        }

        .empty-title {
            font-size: 22px;
            font-weight: 600;
            color: var(--brand-secondary);
            margin-bottom: 10px;
        }

        .empty-text {
            color: var(--muted);
            margin-bottom: 30px;
        }

        .back-button {
            display: inline-block;
            padding: 12px 24px;
            background: var(--bg-light);
            color: var(--brand-primary);
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 2px solid var(--brand-primary);
        }

        .back-button:hover {
            background: var(--brand-primary);
            color: white;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding-top: 24px;
            margin-top: 40px;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 13px;
        }

        .footer a {
            color: var(--brand-primary);
            text-decoration: none;
            font-weight: 600;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 24px;
            }

            .header {
                padding: 32px 20px;
                margin: -40px -20px 30px -20px;
            }

            .header h1 {
                font-size: 28px;
            }

            .bookings-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .results-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .flight-route {
                gap: 8px;
                margin: 16px 0;
                padding: 12px 0;
            }

            .airport-code {
                font-size: 18px;
            }
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--muted);
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid var(--bg-light);
            border-top-color: var(--brand-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <h1>Your Booking Search Results</h1>
            <p>We found the following bookings matching your search</p>
            <div class="search-summary" id="searchSummary"></div>
        </div>
    </div>

    <div class="container">
        <div id="content">
            <div class="loading">
                <div class="spinner"></div>
                <p style="margin-top: 16px;">Loading your bookings...</p>
            </div>
        </div>

        <div class="footer">
            <a href="/lookup.html">← Back to Search</a>
        </div>
    </div>

    <script>
        // Get search parameters
        const urlParams = new URLSearchParams(window.location.search);
        const bookingsData = urlParams.get('bookings');
        const searchType = urlParams.get('type');
        const searchValue = urlParams.get('search');

        async function displayResults() {
            const contentDiv = document.getElementById('content');
            const summaryDiv = document.getElementById('searchSummary');

            try {
                if (!bookingsData) {
                    contentDiv.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">📋</div>
                            <div class="empty-title">No Bookings Found</div>
                            <p class="empty-text">We couldn't find any bookings matching your search.</p>
                            <a href="/lookup.html" class="back-button">
                                <i class="fas fa-arrow-left"></i> New Search
                            </a>
                        </div>
                    `;
                    return;
                }

                // Decode and parse bookings
                const bookings = JSON.parse(decodeURIComponent(bookingsData));

                if (!Array.isArray(bookings) || bookings.length === 0) {
                    contentDiv.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">📋</div>
                            <div class="empty-title">No Bookings Found</div>
                            <p class="empty-text">We couldn't find any bookings matching your search.</p>
                            <a href="/lookup.html" class="back-button">
                                <i class="fas fa-arrow-left"></i> New Search
                            </a>
                        </div>
                    `;
                    return;
                }

                // Build search summary
                let summaryText = `Found <strong>${bookings.length}</strong> booking`;
                if (bookings.length !== 1) summaryText += 's';
                if (searchType === 'email' && searchValue) {
                    summaryText += ` for <strong>${decodeURIComponent(searchValue)}</strong>`;
                }
                summaryDiv.innerHTML = summaryText;

                // Build results header
                let resultsHTML = `
                    <div class="results-header">
                        <div class="results-title">Available Bookings</div>
                        <div class="results-count">${bookings.length} result${bookings.length !== 1 ? 's' : ''}</div>
                    </div>
                    <div class="bookings-grid">
                `;

                // Build booking cards
                bookings.forEach((booking) => {
                    const ref = booking.booking_reference || booking.booking_ref;
                    const departDate = booking.departure_date ? new Date(booking.departure_date).toLocaleDateString('en-US', { 
                        month: 'short', 
                        day: 'numeric', 
                        year: 'numeric' 
                    }) : 'N/A';
                    const flightNumber = booking.flight_number || 'N/A';
                    const origin = booking.origin || 'N/A';
                    const destination = booking.destination || 'N/A';
                    const passengerName = booking.passenger_name || 'Passenger';
                    const seatClass = booking.seat_class || 'Standard';
                    const amount = booking.total_amount ? `$${parseFloat(booking.total_amount).toFixed(2)}` : 'N/A';

                    resultsHTML += `
                        <div class="booking-card" onclick="viewBooking('${ref}')">
                            <div class="card-header">
                                <div class="passenger-name">${passengerName}</div>
                                <div class="booking-ref-badge">${ref}</div>
                            </div>

                            <div class="flight-route">
                                <div class="airport-code">${origin}</div>
                                <div class="route-line"></div>
                                <div class="airport-code">${destination}</div>
                            </div>

                            <div class="card-details">
                                <div class="detail-row">
                                    <span class="detail-label">Flight:</span>
                                    <span class="detail-value">${flightNumber}</span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label">Departure:</span>
                                    <span class="detail-value">${departDate}</span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label">Class:</span>
                                    <span class="detail-value">${seatClass}</span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label">Total:</span>
                                    <span class="detail-value"><strong>${amount}</strong></span>
                                </div>
                            </div>

                            <button class="view-button" onclick="viewBooking('${ref}'); return false;">
                                <i class="fas fa-arrow-right"></i> View Details
                            </button>
                        </div>
                    `;
                });

                resultsHTML += '</div>';
                contentDiv.innerHTML = resultsHTML;

            } catch (error) {
                console.error('Error displaying results:', error);
                contentDiv.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">⚠️</div>
                        <div class="empty-title">Error Loading Results</div>
                        <p class="empty-text">We encountered an error processing your search.</p>
                        <a href="/lookup.html" class="back-button">
                            <i class="fas fa-arrow-left"></i> Try Again
                        </a>
                    </div>
                `;
            }
        }

        function viewBooking(ref) {
            if (ref) {
                window.location.href = `/booking-view.html?ref=${encodeURIComponent(ref)}`;
            }
        }

        // Display results when page loads
        window.addEventListener('DOMContentLoaded', displayResults);
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', displayResults);
        } else {
            displayResults();
        }
    </script>
</body>
</html>
