<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Flights Control — SmartFly Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #f5f7fa; color: #222; }
        
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .navbar h1 { font-size: 28px; font-weight: 700; }

        .nav-links {
            display: flex;
            gap: 24px;
            list-style: none;
        }

        .nav-links a, .logout-btn {
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            border: none;
            background: none;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .nav-links a:hover, .logout-btn:hover { opacity: 0.8; }

        .container { max-width: 1400px; margin: 0 auto; padding: 40px 20px; }

        .header { margin-bottom: 32px; }
        .header h2 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
        .header p { color: #666; }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            transition: transform 0.3s;
        }

        button:hover { transform: translateY(-2px); }

        .table-wrapper {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f9f9f9;
            border-bottom: 2px solid #e0e0e0;
        }

        th {
            padding: 16px;
            text-align: left;
            font-weight: 600;
            color: #666;
            font-size: 13px;
            text-transform: uppercase;
        }

        td {
            padding: 16px;
            border-bottom: 1px solid #f0f0f0;
        }

        tbody tr:hover { background: #f9f9f9; }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: #d1fae5;
            color: #047857;
        }

        .action-btn {
            padding: 6px 12px;
            font-size: 12px;
            margin-right: 6px;
            background: #667eea;
            color: white;
        }

        .action-btn:hover { background: #5568d3; }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show { display: flex; }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 32px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #222;
            font-size: 14px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
        }

        @media (max-width: 768px) {
            .navbar { flex-direction: column; gap: 16px; }
            .nav-links { flex-direction: column; gap: 8px; }
            .controls { flex-direction: column; }
            table { font-size: 12px; }
            th, td { padding: 12px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <h1>🛫 SmartFly Admin</h1>
        <ul class="nav-links">
            <li><a href="/admin/dashboard.html">Dashboard</a></li>
            <li><a href="/admin/checkins.html">Check-ins</a></li>
            <li><a href="/admin/bookings.html">Payments</a></li>
            <li><a href="/admin/flights.html">Flights</a></li>
            <li><a href="/admin/activity-log.html">Activity Log</a></li>
            <li><button class="logout-btn" onclick="logout()">Logout</button></li>
        </ul>
    </nav>

    <div class="container">
        <div class="header">
            <h2>Flights Control</h2>
            <p>Manage flights, capacity, and seat assignments</p>
        </div>

        <div class="controls">
            <button onclick="openAddFlightModal()">➕ Add New Flight</button>
            <button onclick="location.reload()">Refresh</button>
            <button onclick="exportFlightsCSV()" style="background: #10b981; margin-left: auto;">📥 Export CSV</button>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Flight Number</th>
                        <th>Airline</th>
                        <th>Route</th>
                        <th>Departure</th>
                        <th>Capacity</th>
                        <th>Occupancy</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="flightsTable">
                    <tr><td colspan="8" style="text-align: center; padding: 40px;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add/Edit Flight Modal -->
    <div id="flightModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalTitle">Add New Flight</span>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <form onsubmit="saveFlight(event)">
                <div class="form-group">
                    <label>Flight Number *</label>
                    <input type="text" id="flightNumber" required>
                </div>
                <div class="form-group">
                    <label>Airline</label>
                    <input type="text" id="airline">
                </div>
                <div class="form-group">
                    <label>Origin Airport</label>
                    <input type="text" id="origin" placeholder="e.g., JFK">
                </div>
                <div class="form-group">
                    <label>Destination Airport</label>
                    <input type="text" id="destination" placeholder="e.g., LHR">
                </div>
                <div class="form-group">
                    <label>Departure Date & Time</label>
                    <input type="datetime-local" id="departTime">
                </div>
                <div class="form-group">
                    <label>Arrival Date & Time</label>
                    <input type="datetime-local" id="arrivalTime">
                </div>
                <div class="form-group">
                    <label>Aircraft Type</label>
                    <input type="text" id="aircraft" placeholder="e.g., Boeing 737">
                </div>
                <div class="form-group">
                    <label>Capacity</label>
                    <input type="number" id="capacity" min="1">
                </div>
                <div class="form-group">
                    <label>Gate</label>
                    <input type="text" id="gate" placeholder="e.g., A12">
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="checkinEnabled" checked>
                        Check-in Enabled
                    </label>
                </div>
                <div style="display: flex; gap: 12px;">
                    <button type="submit">Save Flight</button>
                    <button type="button" onclick="closeModal()" style="background: #999;">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let allFlights = [];

        function checkAuth() {
            const token = localStorage.getItem('adminToken') || localStorage.getItem('session');
            if (!token) {
                setTimeout(() => {
                    if (!localStorage.getItem('adminToken') && !localStorage.getItem('session')) {
                        window.location.href = '/admin-login.html';
                    }
                }, 100);
                return false;
            }
            return true;
        }

        async function loadFlights() {
            try {
                const res = await fetch('/api/flights');
                const data = await res.json();
                allFlights = data.flights || [];
                renderTable();
            } catch (err) {
                console.error('Failed to load flights:', err);
            }
        }

        function renderTable() {
            const table = document.getElementById('flightsTable');
            if (allFlights.length === 0) {
                table.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 40px;">No flights found</td></tr>';
                return;
            }

            table.innerHTML = allFlights.map(f => {
                const capacity = f.capacity || 0;
                const deptIso = f.departure_time || f.time || '';
                const dept = deptIso ? new Date(deptIso.replace('Z','')).toLocaleString() : 'TBD';
                const classes = (f.classes || []).map(c => `${c.name} $${(c.price||0).toFixed ? c.price.toFixed(2) : c.price}`).join('<br>');
                const checkBadge = f.checkin_enabled ? '🟢 Open' : '🔴 Closed';

                return `
                    <tr>
                        <td><strong>${f.flight}</strong><br><small>${f.aircraft || ''}</small></td>
                        <td>${f.airline || '—'}</td>
                        <td>${f.origin || '—'} → ${f.destination || '—'}</td>
                        <td>${f.date || ''}<br><small>${dept}</small></td>
                        <td>${capacity}</td>
                        <td class="classes">${classes || '—'}</td>
                        <td><span class="status-badge">${checkBadge}</span></td>
                        <td>
                            <button class="action-btn" onclick="manageSeatBlocking('${f.flight}')">Seats</button>
                            <button class="action-btn" onclick="editFlight('${f.flight}')">Edit</button>
                            <button class="action-btn" style="background: #ef4444;" onclick="deleteFlight('${f.flight}')">Delete</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function openAddFlightModal() {
            document.getElementById('modalTitle').textContent = 'Add New Flight';
            document.getElementById('flightNumber').value = '';
            document.getElementById('airline').value = '';
            document.getElementById('origin').value = '';
            document.getElementById('destination').value = '';
            document.getElementById('departTime').value = '';
            document.getElementById('arrivalTime').value = '';
            document.getElementById('aircraft').value = '';
            document.getElementById('capacity').value = '';
            document.getElementById('gate').value = '';
            document.getElementById('flightModal').classList.add('show');
        }

        function editFlight(flightNum) {
            alert('Edit flight: ' + flightNum);
        }

        function deleteFlight(flightNum) {
            if (confirm('Delete flight ' + flightNum + '?')) {
                allFlights = allFlights.filter(f => f.flight !== flightNum);
                renderTable();
            }
        }

        function saveFlight(event) {
            event.preventDefault();
            
            const newFlight = {
                flight: document.getElementById('flightNumber').value,
                airline: document.getElementById('airline').value,
                origin: document.getElementById('origin').value,
                destination: document.getElementById('destination').value,
                time: document.getElementById('departTime').value,
                arrival: document.getElementById('arrivalTime').value,
                aircraft: document.getElementById('aircraft').value,
                capacity: parseInt(document.getElementById('capacity').value),
                gate: document.getElementById('gate').value,
                checkin_enabled: document.getElementById('checkinEnabled').checked,
                blocked_seats: []
            };

            allFlights.push(newFlight);
            renderTable();
            closeModal();
            alert('Flight added successfully!');
        }

        function closeModal() {
            document.getElementById('flightModal').classList.remove('show');
            closeSeatModal();
        }

        // Seat blocking management
        function manageSeatBlocking(flightNumber) {
            const flight = allFlights.find(f => f.flight === flightNumber);
            if (!flight) return;

            const capacity = flight.capacity || 0;
            const blockedSeats = flight.blocked_seats || [];

            let seatsHtml = '<div style="display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; max-height: 400px; overflow-y: auto;">';
            
            for (let i = 1; i <= capacity; i++) {
                const isBlocked = blockedSeats.includes(i);
                const seatClass = isBlocked ? 'seat-blocked' : 'seat-available';
                seatsHtml += `
                    <div class="seat-item ${seatClass}" onclick="toggleSeat('${flightNumber}', ${i})">
                        <div style="font-size: 10px; font-weight: 600;">${i}</div>
                        <div style="font-size: 18px;">${isBlocked ? '🔒' : '💺'}</div>
                    </div>
                `;
            }
            seatsHtml += '</div>';

            const modal = document.createElement('div');
            modal.id = 'seatModal';
            modal.className = 'modal show';
            modal.innerHTML = `
                <div class="modal-content" style="max-width: 600px;">
                    <div class="modal-header">
                        <span>Seat Blocking — ${flightNumber}</span>
                        <button class="modal-close" onclick="closeSeatModal()">×</button>
                    </div>
                    <div style="padding: 20px;">
                        <p style="margin-bottom: 16px; color: #666;">Click seats to block/unblock</p>
                        ${seatsHtml}
                        <div style="margin-top: 20px; display: flex; gap: 16px; font-size: 13px;">
                            <div><span style="color: #10b981;">💺</span> Available</div>
                            <div><span style="color: #ef4444;">🔒</span> Blocked</div>
                        </div>
                        <button onclick="saveSeatBlocking('${flightNumber}')" style="margin-top: 20px; width: 100%;">Save Changes</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function toggleSeat(flightNumber, seatNumber) {
            const flight = allFlights.find(f => f.flight === flightNumber);
            if (!flight) return;

            if (!flight.blocked_seats) flight.blocked_seats = [];
            
            const index = flight.blocked_seats.indexOf(seatNumber);
            if (index > -1) {
                flight.blocked_seats.splice(index, 1);
            } else {
                flight.blocked_seats.push(seatNumber);
            }

            manageSeatBlocking(flightNumber);
        }

        async function saveSeatBlocking(flightNumber) {
            const flight = allFlights.find(f => f.flight === flightNumber);
            if (!flight) return;

            try {
                const token = localStorage.getItem('adminToken') || localStorage.getItem('session');
                const response = await fetch(`/api/flights/${flightNumber}/seats`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ blocked_seats: flight.blocked_seats })
                });

                if (response.ok) {
                    alert('✅ Seat blocking updated successfully');
                    closeSeatModal();
                    loadFlights();
                } else {
                    alert('❌ Failed to save seat blocking');
                }
            } catch (error) {
                console.error('Error saving seat blocking:', error);
                alert('❌ Error saving. Please try again.');
            }
        }

        function closeSeatModal() {
            const modal = document.getElementById('seatModal');
            if (modal) modal.remove();
        }

        function exportFlightsCSV() {
            const token = localStorage.getItem('adminToken') || localStorage.getItem('session');
            fetch('/api/export/flights', {
                headers: { 'Authorization': `Bearer ${token}` }
            }).then(res => {
                if (!res.ok) throw new Error('Export failed');
                return res.blob();
            }).then(blob => {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'flights.csv';
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
            }).catch(err => {
                console.error('Export error:', err);
                alert('Failed to export flights');
            });
        }

        function logout() {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('session');
            window.location.href = '/admin-login.html';
        }

        if (checkAuth()) {
            loadFlights();
        } else {
            document.body.innerHTML = '<p style="text-align:center;padding:50px;">Redirecting to login...</p>';
        }
    </script>
    <style>
        .seat-item {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .seat-available {
            background: #f0fdf4;
            border-color: #10b981;
        }
        .seat-available:hover {
            background: #dcfce7;
            transform: scale(1.05);
        }
        .seat-blocked {
            background: #fef2f2;
            border-color: #ef4444;
        }
        .seat-blocked:hover {
            background: #fee2e2;
            transform: scale(1.05);
        }
    </style>
</body>
</html>
