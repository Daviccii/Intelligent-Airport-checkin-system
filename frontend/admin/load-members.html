<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Load Mock Members - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container-box {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            text-align: center;
        }
        h1 {
            color: #2d3748;
            margin-bottom: 20px;
            font-weight: 800;
        }
        p {
            color: #718096;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .btn-group-vertical {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #e2e8f0;
            color: #2d3748;
        }
        .btn-secondary:hover {
            background: #cbd5e1;
        }
        .status-box {
            background: #f8fafc;
            border-radius: 10px;
            padding: 20px;
            margin-top: 30px;
            border-left: 4px solid #667eea;
        }
        .status-box h3 {
            color: #2d3748;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .status-item {
            text-align: left;
            color: #475569;
            font-size: 14px;
            margin: 8px 0;
        }
        .status-item i {
            margin-right: 8px;
            width: 20px;
        }
        .success {
            color: #10b981;
        }
        .info {
            color: #3b82f6;
        }
        .warning {
            color: #f59e0b;
        }
        .error {
            color: #ef4444;
        }
    </style>
</head>
<body>
    <div class="container-box">
        <h1><i class="fas fa-database"></i> Member Data Manager</h1>
        <p>Load or manage mock member data for the admin dashboard</p>
        
        <div class="btn-group-vertical">
            <button class="btn btn-primary" onclick="generateMockMembers()">
                <i class="fas fa-plus-circle"></i> Generate 100 Mock Members
            </button>
            <button class="btn btn-secondary" onclick="viewExistingMembers()">
                <i class="fas fa-users"></i> View Existing Members
            </button>
            <button class="btn btn-secondary" onclick="clearAllMembers()">
                <i class="fas fa-trash"></i> Clear All Members
            </button>
            <button class="btn btn-secondary" onclick="goToAdminDashboard()">
                <i class="fas fa-arrow-left"></i> Back to Members Dashboard
            </button>
        </div>

        <div class="status-box">
            <h3>Data Status</h3>
            <div id="statusContent">
                <div class="status-item info"><i class="fas fa-circle-notch fa-spin"></i> Checking data...</div>
            </div>
        </div>
    </div>

    <script>
        // Check initial status
        window.addEventListener('load', function() {
            updateStatus();
        });

        function updateStatus() {
            const members = localStorage.getItem('registeredMembers');
            let html = '';

            if (members) {
                try {
                    const data = JSON.parse(members);
                    const silver = data.filter(m => m.memberType === 'Silver').length;
                    const gold = data.filter(m => m.memberType === 'Gold').length;
                    const platinum = data.filter(m => m.memberType === 'Platinum').length;

                    html = `
                        <div class="status-item success"><i class="fas fa-check-circle"></i> Members data loaded</div>
                        <div class="status-item info"><i class="fas fa-users"></i> Total: ${data.length} members</div>
                        <div class="status-item info"><i class="fas fa-medal"></i> Silver: ${silver}</div>
                        <div class="status-item info"><i class="fas fa-crown"></i> Gold: ${gold}</div>
                        <div class="status-item info"><i class="fas fa-gem"></i> Platinum: ${platinum}</div>
                    `;
                } catch (e) {
                    html = '<div class="status-item error"><i class="fas fa-exclamation-circle"></i> Error parsing members data</div>';
                }
            } else {
                html = '<div class="status-item warning"><i class="fas fa-warning"></i> No member data found. Click "Generate Mock Members" to create sample data.</div>';
            }

            document.getElementById('statusContent').innerHTML = html;
        }

        function generateMockMembers() {
            const firstNames = [
                'James', 'Mary', 'John', 'Patricia', 'Robert', 'Jennifer', 'Michael', 'Linda', 'William', 'Elizabeth',
                'David', 'Barbara', 'Richard', 'Susan', 'Joseph', 'Jessica', 'Thomas', 'Sarah', 'Charles', 'Karen',
                'Christopher', 'Nancy', 'Daniel', 'Lisa', 'Matthew', 'Betty', 'Anthony', 'Margaret', 'Mark', 'Sandra',
                'Donald', 'Ashley', 'Steven', 'Kimberly', 'Paul', 'Emily', 'Andrew', 'Donna', 'Joshua', 'Michelle',
                'Kenneth', 'Dorothy', 'Kevin', 'Carol', 'Brian', 'Amanda', 'George', 'Melissa', 'Edward', 'Deborah',
                'Ronald', 'Stephanie', 'Timothy', 'Rebecca', 'Jason', 'Sharon', 'Jeffrey', 'Laura', 'Ryan', 'Cynthia',
                'Jacob', 'Kathleen', 'Gary', 'Amy', 'Nicholas', 'Shirley', 'Eric', 'Angela', 'Jonathan', 'Helen',
                'Stephen', 'Anna', 'Larry', 'Brenda', 'Justin', 'Pamela', 'Scott', 'Nicole', 'Brandon', 'Emma',
                'Benjamin', 'Samantha', 'Samuel', 'Katherine', 'Raymond', 'Christine', 'Patrick', 'Debra', 'Alexander', 'Rachel',
                'Jack', 'Catherine', 'Dennis', 'Carolyn', 'Jerry', 'Janet', 'Tyler', 'Ruth', 'Aaron', 'Maria'
            ];

            const lastNames = [
                'Smith', 'Johnson', 'Williams', 'Brown', 'Jones', 'Garcia', 'Miller', 'Davis', 'Rodriguez', 'Martinez',
                'Hernandez', 'Lopez', 'Gonzalez', 'Wilson', 'Anderson', 'Thomas', 'Taylor', 'Moore', 'Jackson', 'Martin',
                'Lee', 'Perez', 'Thompson', 'White', 'Harris', 'Sanchez', 'Clark', 'Ramirez', 'Lewis', 'Robinson',
                'Walker', 'Young', 'Allen', 'King', 'Wright', 'Scott', 'Torres', 'Nguyen', 'Hill', 'Flores',
                'Green', 'Adams', 'Nelson', 'Baker', 'Hall', 'Rivera', 'Campbell', 'Mitchell', 'Carter', 'Roberts',
                'Gomez', 'Phillips', 'Evans', 'Turner', 'Diaz', 'Parker', 'Cruz', 'Edwards', 'Collins', 'Reyes',
                'Stewart', 'Morris', 'Morales', 'Murphy', 'Cook', 'Rogers', 'Gutierrez', 'Ortiz', 'Morgan', 'Cooper',
                'Peterson', 'Bailey', 'Reed', 'Kelly', 'Howard', 'Ramos', 'Kim', 'Cox', 'Ward', 'Richardson',
                'Watson', 'Brooks', 'Chavez', 'Wood', 'James', 'Bennett', 'Gray', 'Mendoza', 'Ruiz', 'Hughes',
                'Price', 'Alvarez', 'Castillo', 'Sanders', 'Patel', 'Myers', 'Long', 'Ross', 'Foster', 'Jimenez'
            ];

            const countries = [
                'United States', 'Canada', 'United Kingdom', 'Australia', 'Germany', 
                'France', 'Japan', 'South Korea', 'Singapore', 'Netherlands',
                'Switzerland', 'Sweden', 'Norway', 'Denmark', 'Finland',
                'New Zealand', 'Ireland', 'Belgium', 'Austria', 'Spain',
                'Italy', 'Portugal', 'Greece', 'Brazil', 'Mexico',
                'Argentina', 'Chile', 'United Arab Emirates', 'Qatar', 'Saudi Arabia'
            ];

            const membershipTiers = ['Silver', 'Gold', 'Platinum'];
            const fees = { Silver: 29, Gold: 59, Platinum: 99 };

            const members = [];

            // Generate 100 members
            for (let i = 0; i < 100; i++) {
                const firstName = firstNames[Math.floor(Math.random() * firstNames.length)];
                const lastName = lastNames[Math.floor(Math.random() * lastNames.length)];
                const country = countries[Math.floor(Math.random() * countries.length)];
                
                // Distribute tiers: 40% Silver, 35% Gold, 25% Platinum
                let tier;
                const rand = Math.random();
                if (rand < 0.40) {
                    tier = 'Silver';
                } else if (rand < 0.75) {
                    tier = 'Gold';
                } else {
                    tier = 'Platinum';
                }

                // Generate random phone number
                const phone = `+1-${Math.floor(Math.random() * 900 + 100)}-${Math.floor(Math.random() * 900 + 100)}-${Math.floor(Math.random() * 9000 + 1000)}`;
                
                // Generate email
                const email = `${firstName.toLowerCase()}.${lastName.toLowerCase()}${i}@email.com`;
                
                // Generate random join date within last 2 years
                const daysAgo = Math.floor(Math.random() * 730);
                const joinDate = new Date();
                joinDate.setDate(joinDate.getDate() - daysAgo);
                
                // Generate random balance between $50 and $5000
                const balance = Math.floor(Math.random() * 4951) + 50;
                
                members.push({
                    firstName: firstName,
                    lastName: lastName,
                    email: email,
                    phone: phone,
                    country: country,
                    password: 'member123',
                    memberType: tier,
                    membershipFee: fees[tier],
                    balance: balance,
                    joined: joinDate.toISOString()
                });
            }

            // Store in localStorage
            localStorage.setItem('registeredMembers', JSON.stringify(members));

            alert('✓ Successfully generated 100 mock members! \n\nDistribution:\nSilver: ~40\nGold: ~35\nPlatinum: ~25\n\nGo to Members Dashboard to view them.');
            updateStatus();
        }

        function viewExistingMembers() {
            const members = localStorage.getItem('registeredMembers');
            
            if (!members) {
                alert('No member data found. Click "Generate Mock Members" first.');
                return;
            }

            try {
                const data = JSON.parse(members);
                const silver = data.filter(m => m.memberType === 'Silver').length;
                const gold = data.filter(m => m.memberType === 'Gold').length;
                const platinum = data.filter(m => m.memberType === 'Platinum').length;

                const message = `Member Data Summary:\n\nTotal Members: ${data.length}\n\nSilver Tier: ${silver} ($29/month)\nGold Tier: ${gold} ($59/month)\nPlatinum Tier: ${platinum} ($99/month)\n\nYou can view all members in the Members Dashboard.`;
                
                alert(message);
            } catch (e) {
                alert('Error reading member data: ' + e.message);
            }
        }

        function clearAllMembers() {
            if (confirm('Are you sure you want to delete all member data? This cannot be undone.')) {
                localStorage.removeItem('registeredMembers');
                alert('All member data has been cleared.');
                updateStatus();
            }
        }

        function goToAdminDashboard() {
            window.location.href = './members.html';
        }
    </script>
</body>
</html>
