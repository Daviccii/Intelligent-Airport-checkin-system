<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="64" viewBox="0 0 360 64" role="img" aria-labelledby="titleDesc">
  <title id="titleDesc">SmartFly Airways</title>
  <defs>
    <linearGradient id="gA" x1="0" x2="1">
      <stop offset="0%" stop-color="#1e90ff" />
      <stop offset="100%" stop-color="#062f6b" />
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#07294a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <g fill="none" fill-rule="evenodd">
    <!-- Mark: stylized wing/plane swoosh -->
    <path d="M12 36c14-6 58-24 108-24 42 0 86 18 122 34 1 .4 2 .6 3 1 0 0-34 6-72 6-36 0-85-8-131-17z" fill="url(#gA)" opacity="0.95" filter="url(#s)"/>
    <g transform="translate(8,12)">
      <path d="M0 28c0-4 10-14 22-18 18-6 34-6 48-2 18 5 34 16 56 20 14 3 28 4 40 4" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" fill="none"/>
    </g>

    <!-- Text: SmartFly (display) and Airways (sub) -->
    <g transform="translate(28,42)">
      <text x="0" y="0" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="20" fill="#021f45">SmartFly</text>
      <text x="118" y="0" font-family="'Poppins', Arial, sans-serif" font-weight="600" font-size="12" fill="#1e90ff">Airways</text>
    </g>
