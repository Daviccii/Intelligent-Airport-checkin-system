<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flight Booking &mdash; SmartFly Airlines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-dark: #1e40af;
      --primary: #3b82f6;
      --secondary: #60a5fa;
      --accent-red: #ef4444;
      --success: #16a34a;
      --text-dark: #1f2937;
      --text-muted: #6b7280;
      --bg-light: #f3f4f6;
      --bg-white: #ffffff;
      --border: #e5e7eb;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      --shadow-hover: 0 16px 40px rgba(0, 0, 0, 0.18);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background: #f9fafb;
      color: var(--text-dark);
    }

    .container-layout {
      display: flex;
      min-height: 100vh;
    }

    /* ===================== SIDEBAR ===================== */
    .sidebar {
      width: 280px;
      background: linear-gradient(180deg, var(--primary-dark) 0%, #1e3a8a 100%);
      color: white;
      padding: 28px 20px;
      flex-shrink: 0;
      overflow-y: auto;
      box-shadow: 6px 0 24px rgba(0, 0, 0, 0.15);
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      font-weight: 700;
      font-size: 18px;
    }

    .sidebar-logo i {
      font-size: 24px;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 32px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
      border-radius: 10px;
      font-weight: 500;
      font-size: 14px;
      transition: all 0.25s ease;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.15);
      color: white;
    }

    .nav-item.active {
      background: rgba(255, 255, 255, 0.25);
      color: white;
      border-color: rgba(255, 255, 255, 0.4);
    }

    .nav-item i {
      width: 20px;
      text-align: center;
      font-size: 16px;
    }

    .sidebar-profile {
      margin-top: auto;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .profile-avatar {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
    }

    .profile-info {
      flex: 1;
    }

    .profile-name {
      font-size: 14px;
      font-weight: 600;
      display: block;
    }

    .profile-role {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.75);
      display: block;
    }

    /* ===================== MAIN CONTENT ===================== */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 32px;
    }

    /* Header with Profile */
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .header-title h1 {
      font-size: 32px;
      font-weight: 800;
      margin: 0 0 8px;
      color: var(--text-dark);
      letter-spacing: -0.5px;
    }

    .header-title p {
      color: var(--text-muted);
      margin: 0;
      font-size: 15px;
    }

    .header-profile {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 16px;
      background: var(--bg-white);
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .profile-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 14px;
    }

    .profile-details h4 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
    }

    .profile-details p {
      margin: 0;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Search Form */
    .search-form {
      background: var(--bg-white);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 32px;
      border: 1px solid var(--border);
    }

    .search-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      align-items: flex-end;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dark);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .form-group input,
    .form-group select {
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s ease;
      background: var(--bg-white);
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .search-btn {
      padding: 12px 28px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }

    .search-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(30, 64, 175, 0.35);
    }

    /* Results Header */
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .results-header h2 {
      font-size: 20px;
      font-weight: 700;
      margin: 0;
      color: var(--text-dark);
    }

    .sort-group {
      display: flex;
      gap: 12px;
    }

    .sort-group select {
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-white);
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
    }

    /* Flight Cards Grid */
    .flights-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 20px;
    }

    /* Flight Card */
    .flight-card {
      background: var(--bg-white);
      border-radius: 14px;
      border: 1px solid var(--border);
      overflow: hidden;
      transition: all 0.3s ease;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }

    .flight-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-hover);
      border-color: var(--primary);
    }

    /* Card Header with Logo and Badge */
    .card-header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 16px;
      border-bottom: 1px solid var(--border);
      background: #f9fafb;
    }

    .airline-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .airline-logo {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 18px;
    }

    .airline-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 4px;
    }

    .airline-details h5 {
      margin: 0 0 4px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-dark);
    }

    .airline-details p {
      margin: 0;
      font-size: 12px;
      color: var(--text-muted);
    }

    .discount-badge {
      background: linear-gradient(135deg, var(--accent-red), #dc2626);
      color: white;
      padding: 8px 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      text-align: center;
    }

    /* Card Body */
    .card-body {
      padding: 20px;
      flex: 1;
    }

    /* Route Display */
    .route-display {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      gap: 16px;
    }

    .airport-box {
      flex: 0 0 auto;
      text-align: center;
    }

    .airport-time {
      font-size: 18px;
      font-weight: 800;
      color: var(--primary-dark);
      line-height: 1;
    }

    .airport-code {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
      margin-top: 4px;
    }

    .route-connector {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
    }

    .route-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
    }

    .route-plane {
      font-size: 16px;
    }

    /* Flight Details */
    .flight-details-box {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
      padding: 14px;
      background: #f9fafb;
      border-radius: 10px;
    }

    .detail-item {
      text-align: center;
    }

    .detail-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .detail-value {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
    }

    /* Price Section */
    .price-section {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .price-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .original-price {
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: line-through;
    }

    .discount-price {
      font-size: 28px;
      font-weight: 800;
      color: var(--primary-dark);
      line-height: 1;
    }

    .price-suffix {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .savings-label {
      background: #f0fdf4;
      color: var(--success);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    /* Action Buttons */
    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .book-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      padding: 14px 16px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .book-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(30, 64, 175, 0.35);
    }

    .details-link {
      text-align: center;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.2s ease;
    }

    .details-link:hover {
      color: var(--primary-dark);
      text-decoration: underline;
    }

    /* Empty State */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      background: var(--bg-white);
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    .empty-icon {
      font-size: 64px;
      color: #d1d5db;
      margin-bottom: 16px;
    }

    .empty-state h3 {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 8px;
    }

    .empty-state p {
      color: var(--text-muted);
      margin: 0;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .container-layout {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        padding: 16px;
      }

      .main-content {
        padding: 16px;
      }

      .search-grid {
        grid-template-columns: 1fr;
      }

      .flights-container {
        grid-template-columns: 1fr;
      }

      .header-top {
        flex-direction: column;
        gap: 16px;
        align-items: flex-start;
      }

      .sort-group {
        width: 100%;
      }

      .sort-group select {
        width: 100%;
      }

      .route-display {
        margin-bottom: 16px;
      }

      .flight-details-box {
        grid-template-columns: repeat(2, 1fr);
      }

      .price-section {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
        padding-bottom: 12px;
      }

      .discount-price {
        font-size: 24px;
      }
    }

    /* Currency Toggle */
    .currency-toggle {
      display: flex;
      gap: 4px;
      background: var(--bg-light);
      padding: 4px;
      border-radius: 8px;
    }

    .currency-btn {
      padding: 8px 16px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .currency-btn.active {
      background: white;
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .header-controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body>
  <div class="container-layout">
    <!-- Left Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <i class="fas fa-plane-departure"></i>
        <span>SmartFly</span>
      </div>

      <nav class="sidebar-nav">
        <a href="flights-booking.html" class="nav-item active">
          <i class="fas fa-plane"></i>
          <span>Flights</span>
        </a>
        <a href="hotels-booking.html" class="nav-item">
          <i class="fas fa-hotel"></i>
          <span>Hotels</span>
        </a>
        <a href="car-rentals-booking.html" class="nav-item">
          <i class="fas fa-car"></i>
          <span>Car Rentals</span>
        </a>
        <a href="vacation-packages.html" class="nav-item">
          <i class="fas fa-umbrella-beach"></i>
          <span>Vacation Packages</span>
        </a>
        <a href="#" class="nav-item">
          <i class="fas fa-calendar"></i>
          <span>My Bookings</span>
        </a>
        <a href="#" class="nav-item">
          <i class="fas fa-question-circle"></i>
          <span>Support</span>
        </a>
      </nav>

      <div class="sidebar-profile">
        <div class="profile-avatar">RG</div>
        <div class="profile-info">
          <span class="profile-name">Riley Gabi</span>
          <span class="profile-role">Verified Member</span>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Header with Controls -->
      <div class="header-top">
        <div class="header-title">
          <h1>Find Flights</h1>
          <p>Search and book your perfect flight in seconds.</p>
        </div>
        <div class="header-controls">
          <div class="currency-toggle">
            <button class="currency-btn active" onclick="setCurrency('USD')">USD</button>
            <button class="currency-btn" onclick="setCurrency('KSH')">KSH</button>
          </div>
        </div>
      </div>

      <!-- Search Form -->
      <div class="search-form">
        <div class="search-grid">
          <div class="form-group">
            <label>From (Origin)</label>
            <input type="text" placeholder="Onway" value="Onway">
          </div>
          <div class="form-group">
            <label>To (Destination)</label>
            <input type="text" placeholder="Dhaka, Bangladesh" value="Dhaka, Bangladesh">
          </div>
          <div class="form-group">
            <label>Departure City</label>
            <input type="text" placeholder="Delhi, India" value="Delhi, India">
          </div>
          <div class="form-group">
            <label>Passengers</label>
            <input type="text" placeholder="3 Persons" value="3 Persons">
          </div>
          <div class="form-group">
            <label>Travel Dates</label>
            <input type="text" placeholder="21 Aug'19 - 29 Aug'19" value="21 Aug'19 - 29 Aug'19">
          </div>
          <div class="form-group">
            <button class="search-btn">
              <i class="fas fa-search"></i> Search
            </button>
          </div>
        </div>
      </div>

      <!-- Results Header -->
      <div class="results-header">
        <h2>Available Flights</h2>
        <div class="sort-group">
          <select>
            <option>Sort by Price (Low to High)</option>
            <option>Sort by Price (High to Low)</option>
            <option>Sort by Duration</option>
            <option>Sort by Departure Time</option>
          </select>
        </div>
      </div>

      <!-- Flight Cards Container -->
      <div class="flights-container" id="flightsContainer">
        <!-- Flight cards will be rendered here -->
      </div>
    </main>
  </div>

  <script>
    // Currency management
    let currentCurrency = 'USD';
    const exchangeRate = 130; // 1 USD = 130 KSH

    function setCurrency(currency) {
      currentCurrency = currency;
      document.querySelectorAll('.currency-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');
      renderFlights();
    }

    function getPrice(priceUSD) {
      if (currentCurrency === 'USD') return priceUSD;
      return Math.round(priceUSD * exchangeRate);
    }

    function getCurrencySymbol() {
      return currentCurrency === 'USD' ? '৳' : 'KSH ';
    }

    // Sample flight data
    const flights = [
      {
        airline: "Emirates",
        code: "EM 405",
        departure: "12:10",
        arrival: "18:30",
        duration: "6h 10m",
        from: "DEL",
        to: "DXB",
        price: 399,
        originalPrice: 499,
        discount: 20,
        stops: "Direct"
      },
      {
        airline: "Qatar Airways",
        code: "QA 224",
        departure: "14:45",
        arrival: "20:15",
        duration: "5h 30m",
        from: "DEL",
        to: "DXB",
        price: 349,
        originalPrice: 450,
        discount: 22,
        stops: "Direct"
      },
      {
        airline: "Turkish Airlines",
        code: "TK 702",
        departure: "08:00",
        arrival: "15:40",
        duration: "7h 40m",
        from: "DEL",
        to: "DXB",
        price: 299,
        originalPrice: 399,
        discount: 25,
        stops: "1 Stop"
      },
      {
        airline: "Air India",
        code: "AI 951",
        departure: "16:20",
        arrival: "22:50",
        duration: "6h 30m",
        from: "DEL",
        to: "DXB",
        price: 379,
        originalPrice: 479,
        discount: 21,
        stops: "Direct"
      },
      {
        airline: "Lufthansa",
        code: "LH 763",
        departure: "10:30",
        arrival: "19:00",
        duration: "8h 30m",
        from: "DEL",
        to: "DXB",
        price: 329,
        originalPrice: 429,
        discount: 23,
        stops: "1 Stop"
      },
      {
        airline: "Singapore Airlines",
        code: "SQ 402",
        departure: "09:15",
        arrival: "17:45",
        duration: "8h 30m",
        from: "DEL",
        to: "DXB",
        price: 419,
        originalPrice: 549,
        discount: 24,
        stops: "1 Stop"
      }
    ];

    function renderFlights() {
      const container = document.getElementById('flightsContainer');
      
      if (!flights || flights.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">
              <i class="fas fa-inbox"></i>
            </div>
            <h3>No flights found</h3>
            <p>Try adjusting your search criteria</p>
          </div>
        `;
        return;
      }

      container.innerHTML = flights.map(flight => `
        <div class="flight-card">
          <div class="card-header-top">
            <div class="airline-info">
              <div class="airline-logo">
                ${flight.airline.substring(0, 2).toUpperCase()}
              </div>
              <div class="airline-details">
                <h5>${flight.airline}</h5>
                <p>${flight.code}</p>
              </div>
            </div>
            <div class="discount-badge">${flight.discount}% OFF</div>
          </div>

          <div class="card-body">
            <!-- Route Display -->
            <div class="route-display">
              <div class="airport-box">
                <div class="airport-time">${flight.departure}</div>
                <div class="airport-code">${flight.from}</div>
              </div>
              
              <div class="route-connector">
                <div class="route-line"></div>
                <div class="route-plane"><i class="fas fa-plane"></i></div>
                <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px;">
                  <span>${flight.duration}</span>
                  <span style="color: #9ca3af; font-size: 10px;">${flight.stops}</span>
                </div>
                <div class="route-line"></div>
              </div>
              
              <div class="airport-box">
                <div class="airport-time">${flight.arrival}</div>
                <div class="airport-code">${flight.to}</div>
              </div>
            </div>

            <!-- Flight Details -->
            <div class="flight-details-box">
              <div class="detail-item">
                <div class="detail-label">Duration</div>
                <div class="detail-value">${flight.duration}</div>
              </div>
              <div class="detail-item">
                <div class="detail-label">Class</div>
                <div class="detail-value">Economy</div>
              </div>
              <div class="detail-item">
                <div class="detail-label">Baggage</div>
                <div class="detail-value">20kg</div>
              </div>
            </div>

            <!-- Price Section -->
            <div class="price-section">
              <div class="price-box">
                <div class="original-price">${getCurrencySymbol()}${getPrice(flight.originalPrice).toLocaleString()}</div>
                <div class="discount-price">${getCurrencySymbol()}${getPrice(flight.price).toLocaleString()}</div>
                <div class="price-suffix">/person</div>
              </div>
              <div class="savings-label">
                <i class="fas fa-tag"></i> Save ${getCurrencySymbol()}${getPrice(flight.originalPrice - flight.price).toLocaleString()}
              </div>
            </div>

            <!-- Action Buttons -->
            <div class="card-actions">
              <button class="book-btn" onclick="bookFlight('${flight.airline}', '${flight.code}')">
                <i class="fas fa-check-circle"></i> BOOK NOW
              </button>
              <a href="#" class="details-link">View Details →</a>
            </div>
          </div>
        </div>
      `).join('');
    }

    function bookFlight(airline, code) {
      alert(`Booking flight: ${airline} ${code}`);
    }

    // Render flights on page load
    document.addEventListener('DOMContentLoaded', renderFlights);
  </script>
</body>
</html>
