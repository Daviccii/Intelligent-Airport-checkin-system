<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Payment Successful — SmartFly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #222;
    }

    .container {
      max-width: 600px;
      width: 100%;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 60px 40px;
      text-align: center;
    }

    .success-icon {
      width: 100px;
      height: 100px;
      margin: 0 auto 30px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      color: white;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #222;
    }

    .subtitle {
      font-size: 16px;
      color: #666;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .booking-ref {
      background: #f5f7fa;
      border: 2px solid #667eea;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 32px;
    }

    .ref-label {
      font-size: 12px;
      text-transform: uppercase;
      color: #999;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .ref-value {
      font-size: 28px;
      font-weight: 700;
      color: #667eea;
      font-family: 'Courier New', monospace;
    }

    .details {
      background: #f9f9f9;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 32px;
      text-align: left;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 14px;
      border-bottom: 1px solid #e0e0e0;
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      color: #666;
      font-weight: 500;
    }

    .detail-value {
      color: #222;
      font-weight: 600;
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 32px;
    }

    button {
      flex: 1;
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Poppins', sans-serif;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .btn-secondary {
      background: #f5f7fa;
      color: #667eea;
      border: 2px solid #667eea;
    }

    .btn-secondary:hover {
      background: #667eea;
      color: white;
    }

    .info-box {
      background: #e3f2fd;
      border-left: 4px solid #2196F3;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 24px;
      text-align: left;
      font-size: 14px;
      color: #1976D2;
    }

    .info-box strong {
      display: block;
      margin-bottom: 4px;
      color: #1565C0;
    }

    @media (max-width: 600px) {
      .container {
        padding: 40px 24px;
      }

      h1 {
        font-size: 24px;
      }

      .ref-value {
        font-size: 22px;
      }

      .button-group {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="success-icon">✅</div>

    <h1>Payment Successful!</h1>
    
    <p class="subtitle">
      Your payment has been processed successfully. Your booking is now confirmed and has been recorded in our system.
    </p>

    <div class="booking-ref">
      <div class="ref-label">Booking Reference</div>
      <div class="ref-value" id="bookingRef">---</div>
    </div>

    <div class="info-box">
      <strong>📧 Confirmation Email</strong>
      Your booking confirmation has been sent to your email address. Keep this reference number safe for check-in.
    </div>

    <div class="details" id="bookingDetails">
      <!-- Populated by JavaScript -->
    </div>

    <div class="button-group">
      <button class="btn-primary" onclick="goHome()">Back to Home</button>
      <button class="btn-secondary" onclick="goBooking()">View My Bookings</button>
    </div>
  </div>

  <script>
    // Extract URL parameters
    const params = new URLSearchParams(window.location.search);
    
    // Display booking reference
    const ref = params.get('ref');
    if (ref) {
      document.getElementById('bookingRef').textContent = ref;
    }

    // Store booking data in sessionStorage for booking-view.html
    const bookingData = {
      ref: ref,
      ctx: {
        name: params.get('name'),
        email: params.get('email'),
        passport: params.get('passport'),
        phone: params.get('phone'),
        from: params.get('from'),
        to: params.get('to'),
        depart: params.get('depart'),
        ret: params.get('return'),
        cls: params.get('class') || 'Economy',
        fare: params.get('fare')
      },
      paymentMethod: params.get('method')
    };
    
    // Save to both sessionStorage and localStorage
    sessionStorage.setItem('lastBooking', JSON.stringify(bookingData));
    localStorage.setItem('lastBooking', JSON.stringify(bookingData));

    // Display booking details
    const details = [
      { label: 'Passenger Name', value: params.get('name') },
      { label: 'Email', value: params.get('email') },
      { label: 'Passport', value: params.get('passport') },
      { label: 'From', value: params.get('from') },
      { label: 'To', value: params.get('to') },
      { label: 'Departure Date', value: params.get('depart') },
      { label: 'Return Date', value: params.get('return') || 'N/A' },
      { label: 'Class', value: params.get('class') || 'Economy' },
      { label: 'Fare', value: params.get('fare') || '---' },
      { label: 'Payment Method', value: params.get('method')?.toUpperCase() || '---' }
    ];

    const detailsContainer = document.getElementById('bookingDetails');
    details.forEach(detail => {
      if (detail.value) {
        const row = document.createElement('div');
        row.className = 'detail-row';
        row.innerHTML = `
          <span class="detail-label">${detail.label}</span>
          <span class="detail-value">${detail.value}</span>
        `;
        detailsContainer.appendChild(row);
      }
    });

    // Navigation functions
    function goHome() {
      window.location.href = '/';
    }

    function goBooking() {
      const ref = params.get('ref');
      if (ref) {
        window.location.href = `/booking-view.html?ref=${ref}`;
      } else {
        window.location.href = '/booking.html';
      }
    }
  </script>
</body>
</html>
