<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exclusive Member Offers - SmartFly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
            padding: 20px;
        }

        .container-custom {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8e8e 100%);
            border-radius: 20px;
            padding: 40px;
            color: white;
            text-align: center;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.3);
        }

        .header h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.95;
        }

        .filter-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: 12px 24px;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .filter-tab.active {
            background: #ff6b6b;
            color: white;
            border-color: #ff6b6b;
        }

        .filter-tab:hover {
            border-color: #ff6b6b;
        }

        .offers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .offer-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .offer-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .offer-image {
            height: 200px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .offer-image::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
        }

        .offer-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.9);
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: #ff6b6b;
        }

        .offer-content {
            padding: 25px;
        }

        .offer-title {
            font-size: 20px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 10px;
        }

        .offer-description {
            font-size: 14px;
            color: #718096;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .offer-details {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .offer-detail {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #4a5568;
        }

        .offer-detail i {
            color: #ff6b6b;
        }

        .offer-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        .offer-code {
            background: #f7fafc;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: 700;
            color: #2d3748;
            font-family: 'Courier New', monospace;
        }

        .btn-claim {
            background: #ff6b6b;
            color: white;
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-claim:hover {
            background: #ff5252;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #4a5568;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 20px;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #ff6b6b;
        }
    </style>
</head>
<body>
    <div class="container-custom">
        <a href="/members-dashboard.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Dashboard
        </a>

        <div class="header">
            <h1><i class="fas fa-gift"></i> Exclusive Member Offers</h1>
            <p>Premium deals and discounts available only to SmartFly members</p>
        </div>

        <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all">All Offers</button>
            <button class="filter-tab" data-filter="flights">Flight Deals</button>
            <button class="filter-tab" data-filter="upgrades">Upgrades</button>
            <button class="filter-tab" data-filter="perks">Travel Perks</button>
            <button class="filter-tab" data-filter="seasonal">Seasonal</button>
        </div>

        <div class="offers-grid" id="offersGrid">
            <!-- Offers will be dynamically loaded here -->
        </div>
    </div>

    <script>
        const offers = [
            {
                id: 1,
                title: '30% Off All International Flights',
                description: 'Book any international flight and save up to 30% on your journey. Valid for premium, business, and economy class tickets.',
                category: 'flights',
                badge: 'Limited Time',
                icon: 'fa-plane-departure',
                code: 'MEMBER30',
                validUntil: 'Feb 28, 2026',
                minSpend: '$500',
                gradient: 'linear-gradient(135deg, #ff6b6b 0%, #ff8e8e 100%)'
            },
            {
                id: 2,
                title: 'Free Lounge Access Pass',
                description: 'Enjoy complimentary access to all SmartFly premium lounges worldwide. Includes food, drinks, and Wi-Fi.',
                category: 'perks',
                badge: 'Premium Only',
                icon: 'fa-couch',
                code: 'LOUNGE24',
                validUntil: 'Dec 31, 2026',
                minSpend: 'None',
                gradient: 'linear-gradient(135deg, #10b981 0%, #34d399 100%)'
            },
            {
                id: 3,
                title: 'Double Loyalty Points Weekend',
                description: 'Earn 2x loyalty points on all bookings made this weekend. Stack with other promotions for maximum rewards.',
                category: 'flights',
                badge: 'This Weekend',
                icon: 'fa-star',
                code: '2XPOINTS',
                validUntil: 'Jan 14, 2026',
                minSpend: 'None',
                gradient: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)'
            },
            {
                id: 4,
                title: 'Complimentary Seat Upgrade',
                description: 'Upgrade to premium economy or business class for free. Subject to availability on selected routes.',
                category: 'upgrades',
                badge: 'Hot Deal',
                icon: 'fa-chair',
                code: 'UPGRADE24',
                validUntil: 'Mar 15, 2026',
                minSpend: '$800',
                gradient: 'linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%)'
            },
            {
                id: 5,
                title: 'Extra 20kg Baggage Allowance',
                description: 'Get an extra 20kg baggage allowance on all flights. Perfect for shopping trips and long vacations.',
                category: 'perks',
                badge: 'Popular',
                icon: 'fa-suitcase-rolling',
                code: 'BAGGAGE20',
                validUntil: 'Jun 30, 2026',
                minSpend: 'None',
                gradient: 'linear-gradient(135deg, #8b5cf6 0%, #a78bfa 100%)'
            },
            {
                id: 6,
                title: 'Summer Vacation Package',
                description: 'Book a round-trip to any beach destination and get 25% off plus free airport transfers.',
                category: 'seasonal',
                badge: 'Summer Special',
                icon: 'fa-umbrella-beach',
                code: 'SUMMER25',
                validUntil: 'Aug 31, 2026',
                minSpend: '$600',
                gradient: 'linear-gradient(135deg, #06b6d4 0%, #22d3ee 100%)'
            },
            {
                id: 7,
                title: 'Priority Boarding Forever',
                description: 'Get lifetime priority boarding on all SmartFly flights. Skip the queues and board first, every time.',
                category: 'perks',
                badge: 'Lifetime',
                icon: 'fa-ticket-alt',
                code: 'PRIORITY',
                validUntil: 'Lifetime',
                minSpend: 'None',
                gradient: 'linear-gradient(135deg, #ef4444 0%, #f87171 100%)'
            },
            {
                id: 8,
                title: '50% Off Business Class',
                description: 'Upgrade your experience with 50% off business class tickets on selected international routes.',
                category: 'upgrades',
                badge: 'Exclusive',
                icon: 'fa-wine-glass',
                code: 'BUSINESS50',
                validUntil: 'Apr 30, 2026',
                minSpend: '$1,000',
                gradient: 'linear-gradient(135deg, #1e40af 0%, #3b82f6 100%)'
            },
            {
                id: 9,
                title: 'Free Airport Fast Track',
                description: 'Skip security queues with complimentary fast track service at all major airports worldwide.',
                category: 'perks',
                badge: 'New',
                icon: 'fa-running',
                code: 'FASTTRACK',
                validUntil: 'Dec 31, 2026',
                minSpend: 'None',
                gradient: 'linear-gradient(135deg, #f97316 0%, #fb923c 100%)'
            }
        ];

        let currentFilter = 'all';

        function renderOffers(filter = 'all') {
            const grid = document.getElementById('offersGrid');
            const filtered = filter === 'all' ? offers : offers.filter(o => o.category === filter);
            
            grid.innerHTML = filtered.map(offer => `
                <div class="offer-card" data-category="${offer.category}">
                    <div class="offer-image" style="background: ${offer.gradient}">
                        <i class="fas ${offer.icon}"></i>
                        <span class="offer-badge">${offer.badge}</span>
                    </div>
                    <div class="offer-content">
                        <h3 class="offer-title">${offer.title}</h3>
                        <p class="offer-description">${offer.description}</p>
                        <div class="offer-details">
                            <span class="offer-detail">
                                <i class="fas fa-calendar"></i>
                                Until ${offer.validUntil}
                            </span>
                            <span class="offer-detail">
                                <i class="fas fa-dollar-sign"></i>
                                Min: ${offer.minSpend}
                            </span>
                        </div>
                        <div class="offer-footer">
                            <span class="offer-code">${offer.code}</span>
                            <button class="btn-claim" onclick="claimOffer('${offer.code}', '${offer.title}')">
                                Claim Offer
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function claimOffer(code, title) {
            // Copy to clipboard
            navigator.clipboard.writeText(code).then(() => {
                alert(`✈️ "${title}" claimed!\n\nCode "${code}" copied to clipboard.\n\nUse this code at checkout to redeem your exclusive member offer.`);
            }).catch(() => {
                alert(`Your exclusive code: ${code}\n\nUse this at checkout for: ${title}`);
            });
        }

        // Filter functionality
        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                const filter = this.dataset.filter;
                renderOffers(filter);
            });
        });

        // Check if member is logged in
        window.addEventListener('DOMContentLoaded', function() {
            const memberToken = localStorage.getItem('memberToken');
            if (!memberToken) {
                if (confirm('You need to be logged in as a member to view exclusive offers. Login now?')) {
                    window.location.href = '/members-login.html';
                } else {
                    window.location.href = '/';
                }
                return;
            }
            renderOffers();
        });
    </script>
</body>
</html>
