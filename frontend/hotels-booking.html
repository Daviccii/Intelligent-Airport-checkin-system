<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotel Booking &mdash; SmartFly Airlines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-dark: #1e40af;
      --primary: #3b82f6;
      --secondary: #60a5fa;
      --accent-red: #ef4444;
      --success: #16a34a;
      --text-dark: #1f2937;
      --text-muted: #6b7280;
      --bg-light: #f3f4f6;
      --bg-white: #ffffff;
      --border: #e5e7eb;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      --shadow-hover: 0 16px 40px rgba(0, 0, 0, 0.18);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background: #f9fafb;
      color: var(--text-dark);
    }

    .container-layout {
      display: flex;
      min-height: 100vh;
    }

    /* ===================== SIDEBAR ===================== */
    .sidebar {
      width: 280px;
      background: linear-gradient(180deg, var(--primary-dark) 0%, #1e3a8a 100%);
      color: white;
      padding: 28px 20px;
      flex-shrink: 0;
      overflow-y: auto;
      box-shadow: 6px 0 24px rgba(0, 0, 0, 0.15);
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      font-weight: 700;
      font-size: 18px;
    }

    .sidebar-logo i {
      font-size: 24px;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 32px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
      border-radius: 10px;
      font-weight: 500;
      font-size: 14px;
      transition: all 0.25s ease;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.15);
      color: white;
    }

    .nav-item.active {
      background: rgba(255, 255, 255, 0.25);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.35);
    }

    .nav-item i {
      font-size: 16px;
    }

    .sidebar-profile {
      margin-top: auto;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .profile-avatar {
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: white;
    }

    .profile-info {
      display: flex;
      flex-direction: column;
      font-size: 13px;
    }

    .profile-name {
      font-weight: 600;
      color: white;
    }

    .profile-role {
      color: rgba(255, 255, 255, 0.7);
    }

    /* ===================== MAIN CONTENT ===================== */
    .main-content {
      flex: 1;
      padding: 32px;
      overflow-y: auto;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .header-title h1 {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .header-title p {
      color: var(--text-muted);
      font-size: 14px;
    }

    .header-controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .currency-toggle {
      display: flex;
      gap: 4px;
      background: var(--bg-light);
      padding: 4px;
      border-radius: 8px;
    }

    .currency-btn {
      padding: 8px 16px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .currency-btn.active {
      background: white;
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    /* Search Form */
    .search-form {
      background: var(--bg-white);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 32px;
      box-shadow: var(--shadow);
    }

    .search-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input,
    .form-group select {
      padding: 12px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .search-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      align-self: flex-end;
    }

    .search-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(30, 64, 175, 0.35);
    }

    /* Results Header */
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .results-header h2 {
      font-size: 24px;
      font-weight: 700;
    }

    .sort-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sort-group select {
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      background: var(--bg-white);
      cursor: pointer;
    }

    /* Hotels Grid */
    .hotels-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }

    /* Hotel Card */
    .hotel-card {
      background: var(--bg-white);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.3s ease;
      border: 1px solid var(--border);
      cursor: pointer;
    }

    .hotel-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-hover);
      border-color: var(--primary);
    }

    .hotel-image {
      width: 100%;
      height: 180px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      color: white;
      position: relative;
      overflow: hidden;
    }

    .hotel-image.beach {
      background: linear-gradient(135deg, #f093fb, #f5576c);
    }

    .hotel-image.mountain {
      background: linear-gradient(135deg, #4facfe, #00f2fe);
    }

    .hotel-image.city {
      background: linear-gradient(135deg, #fa709a, #fee140);
    }

    .hotel-image.luxury {
      background: linear-gradient(135deg, #30cfd0, #330867);
    }

    .rating-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(255, 255, 255, 0.95);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--primary-dark);
    }

    /* Hotel Info */
    .hotel-info {
      padding: 16px;
    }

    .hotel-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 12px;
    }

    .hotel-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 4px;
    }

    .hotel-location {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .hotel-amenities {
      display: flex;
      gap: 8px;
      margin: 12px 0;
      flex-wrap: wrap;
    }

    .amenity {
      background: var(--bg-light);
      color: var(--text-muted);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }

    /* Hotel Details */
    .hotel-details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin: 12px 0;
      padding: 12px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .detail-item {
      text-align: center;
    }

    .detail-label {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .detail-value {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
    }

    /* Price Section */
    .hotel-price {
      margin-top: 12px;
      text-align: right;
    }

    .price-per-night {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .price-amount {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary-dark);
    }

    .price-suffix {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Action Button */
    .book-hotel-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      margin-top: 12px;
      transition: all 0.3s ease;
    }

    .book-hotel-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(30, 64, 175, 0.35);
    }

    /* Empty State */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      background: var(--bg-white);
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    .empty-icon {
      font-size: 64px;
      color: #d1d5db;
      margin-bottom: 16px;
    }

    .empty-state h3 {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 8px;
    }

    .empty-state p {
      color: var(--text-muted);
      margin: 0;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .container-layout {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        padding: 16px;
      }

      .main-content {
        padding: 16px;
      }

      .search-grid {
        grid-template-columns: 1fr;
      }

      .hotels-container {
        grid-template-columns: 1fr;
      }

      .header-top {
        flex-direction: column;
        gap: 16px;
        align-items: flex-start;
      }

      .results-header {
        flex-direction: column;
        gap: 16px;
        align-items: flex-start;
      }

      .sort-group {
        width: 100%;
      }

      .sort-group select {
        width: 100%;
      }
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body>
  <div class="container-layout">
    <!-- Left Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <i class="fas fa-plane-departure"></i>
        <span>SmartFly</span>
      </div>

      <nav class="sidebar-nav">
        <a href="flights-booking.html" class="nav-item">
          <i class="fas fa-home"></i>
          <span>Flights</span>
        </a>
        <a href="hotels-booking.html" class="nav-item active">
          <i class="fas fa-hotel"></i>
          <span>Hotels</span>
        </a>
        <a href="car-rentals-booking.html" class="nav-item">
          <i class="fas fa-car"></i>
          <span>Car Rentals</span>
        </a>
        <a href="vacation-packages.html" class="nav-item">
          <i class="fas fa-umbrella-beach"></i>
          <span>Vacation Packages</span>
        </a>
        <a href="#" class="nav-item">
          <i class="fas fa-calendar"></i>
          <span>My Bookings</span>
        </a>
        <a href="#" class="nav-item">
          <i class="fas fa-question-circle"></i>
          <span>Support</span>
        </a>
      </nav>

      <div class="sidebar-profile">
        <div class="profile-avatar">RG</div>
        <div class="profile-info">
          <span class="profile-name">Riley Gabi</span>
          <span class="profile-role">Verified Member</span>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Header with Controls -->
      <div class="header-top">
        <div class="header-title">
          <h1>Find Hotels</h1>
          <p>Browse and book luxury accommodations worldwide.</p>
        </div>
        <div class="header-controls">
          <div class="currency-toggle">
            <button class="currency-btn active" onclick="setCurrency('USD')">USD</button>
            <button class="currency-btn" onclick="setCurrency('KSH')">KSH</button>
          </div>
        </div>
      </div>

      <!-- Search Form -->
      <div class="search-form">
        <div class="search-grid">
          <div class="form-group">
            <label>Location</label>
            <input type="text" placeholder="City or hotel name" value="">
          </div>
          <div class="form-group">
            <label>Check-In</label>
            <input type="date">
          </div>
          <div class="form-group">
            <label>Check-Out</label>
            <input type="date">
          </div>
          <div class="form-group">
            <label>Rooms</label>
            <select>
              <option>1 Room</option>
              <option>2 Rooms</option>
              <option>3 Rooms</option>
            </select>
          </div>
          <div class="form-group">
            <button class="search-btn">
              <i class="fas fa-search"></i> Search
            </button>
          </div>
        </div>
      </div>

      <!-- Results Header -->
      <div class="results-header">
        <h2>Available Hotels</h2>
        <div class="sort-group">
          <select>
            <option>Sort by Price (Low to High)</option>
            <option>Sort by Price (High to Low)</option>
            <option>Sort by Rating</option>
            <option>Sort by Distance</option>
          </select>
        </div>
      </div>

      <!-- Hotels Grid -->
      <div class="hotels-container" id="hotelsContainer"></div>
    </main>
  </div>

  <script>
    let currentCurrency = 'USD';
    const exchangeRate = 130; // 1 USD = 130 KSH

    const hotels = [
      {
        id: 1,
        name: 'Sunset Beach Resort',
        location: 'Maldives',
        type: 'beach',
        rating: 4.8,
        reviews: 245,
        priceUSD: 280,
        amenities: ['WiFi', 'Pool', 'Beach', 'Spa'],
        rooms: 120,
        occupancy: '85%'
      },
      {
        id: 2,
        name: 'Mountain Peak Lodge',
        location: 'Switzerland',
        type: 'mountain',
        rating: 4.9,
        reviews: 312,
        priceUSD: 320,
        amenities: ['WiFi', 'Gym', 'Restaurant', 'Skiing'],
        rooms: 85,
        occupancy: '92%'
      },
      {
        id: 3,
        name: 'City Center Hotel',
        location: 'New York',
        type: 'city',
        rating: 4.6,
        reviews: 428,
        priceUSD: 199,
        amenities: ['WiFi', 'Gym', 'Parking', 'Concierge'],
        rooms: 250,
        occupancy: '78%'
      },
      {
        id: 4,
        name: 'Luxury Palace',
        location: 'Dubai',
        type: 'luxury',
        rating: 5.0,
        reviews: 567,
        priceUSD: 450,
        amenities: ['WiFi', 'Spa', 'Pool', 'Helicopter'],
        rooms: 200,
        occupancy: '95%'
      },
      {
        id: 5,
        name: 'Tropical Paradise',
        location: 'Bali',
        type: 'beach',
        rating: 4.7,
        reviews: 389,
        priceUSD: 165,
        amenities: ['WiFi', 'Pool', 'Garden', 'Yoga'],
        rooms: 150,
        occupancy: '88%'
      },
      {
        id: 6,
        name: 'Alpine Cabin',
        location: 'Austria',
        type: 'mountain',
        rating: 4.8,
        reviews: 276,
        priceUSD: 240,
        amenities: ['WiFi', 'Fireplace', 'Sauna', 'Hiking'],
        rooms: 60,
        occupancy: '82%'
      }
    ];

    function setCurrency(currency) {
      currentCurrency = currency;
      document.querySelectorAll('.currency-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');
      renderHotels();
    }

    function getPrice(priceUSD) {
      if (currentCurrency === 'USD') return priceUSD;
      return Math.round(priceUSD * exchangeRate);
    }

    function getCurrencySymbol() {
      return currentCurrency === 'USD' ? '$' : 'KSH ';
    }

    function renderHotels() {
      const container = document.getElementById('hotelsContainer');

      if (!hotels || hotels.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🏨</div>
            <h3>No Hotels Found</h3>
            <p>Try adjusting your search criteria</p>
          </div>
        `;
        return;
      }

      container.innerHTML = hotels.map(hotel => `
        <div class="hotel-card">
          <div class="hotel-image ${hotel.type}">
            <i class="fas fa-hotel"></i>
            <div class="rating-badge">⭐ ${hotel.rating}</div>
          </div>

          <div class="hotel-info">
            <div class="hotel-header">
              <div>
                <div class="hotel-name">${hotel.name}</div>
                <div class="hotel-location">
                  <i class="fas fa-map-marker-alt"></i>
                  ${hotel.location}
                </div>
              </div>
            </div>

            <div class="hotel-amenities">
              ${hotel.amenities.map(a => `<span class="amenity">${a}</span>`).join('')}
            </div>

            <div class="hotel-details">
              <div class="detail-item">
                <div class="detail-label">Rooms</div>
                <div class="detail-value">${hotel.rooms}</div>
              </div>
              <div class="detail-item">
                <div class="detail-label">Occupancy</div>
                <div class="detail-value">${hotel.occupancy}</div>
              </div>
            </div>

            <div class="hotel-price">
              <div class="price-per-night">Price per night</div>
              <div class="price-amount">${getCurrencySymbol()}${getPrice(hotel.priceUSD).toLocaleString()}</div>
              <div class="price-suffix">${hotel.reviews} reviews</div>
            </div>

            <button class="book-hotel-btn" onclick="bookHotel('${hotel.name}')">
              <i class="fas fa-check-circle"></i> BOOK NOW
            </button>
          </div>
        </div>
      `).join('');
    }

    function bookHotel(hotelName) {
      alert(`Booking ${hotelName}... Redirecting to payment.`);
    }

    // Render hotels on page load
    document.addEventListener('DOMContentLoaded', renderHotels);
  </script>
</body>
</html>
