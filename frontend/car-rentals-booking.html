<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Car Rentals &mdash; SmartFly Airlines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-dark: #1e40af;
      --primary: #3b82f6;
      --secondary: #60a5fa;
      --accent-red: #ef4444;
      --success: #16a34a;
      --text-dark: #1f2937;
      --text-muted: #6b7280;
      --bg-light: #f3f4f6;
      --bg-white: #ffffff;
      --border: #e5e7eb;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      --shadow-hover: 0 16px 40px rgba(0, 0, 0, 0.18);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background: #f9fafb;
      color: var(--text-dark);
    }

    .container-layout {
      display: flex;
      min-height: 100vh;
    }

    /* ===================== SIDEBAR ===================== */
    .sidebar {
      width: 280px;
      background: linear-gradient(180deg, var(--primary-dark) 0%, #1e3a8a 100%);
      color: white;
      padding: 28px 20px;
      flex-shrink: 0;
      overflow-y: auto;
      box-shadow: 6px 0 24px rgba(0, 0, 0, 0.15);
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      font-weight: 700;
      font-size: 18px;
    }

    .sidebar-logo i {
      font-size: 24px;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 32px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
      border-radius: 10px;
      font-weight: 500;
      font-size: 14px;
      transition: all 0.25s ease;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.15);
      color: white;
    }

    .nav-item.active {
      background: rgba(255, 255, 255, 0.25);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.35);
    }

    .nav-item i {
      font-size: 16px;
    }

    .sidebar-profile {
      margin-top: auto;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .profile-avatar {
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: white;
    }

    .profile-info {
      display: flex;
      flex-direction: column;
      font-size: 13px;
    }

    .profile-name {
      font-weight: 600;
      color: white;
    }

    .profile-role {
      color: rgba(255, 255, 255, 0.7);
    }

    /* ===================== MAIN CONTENT ===================== */
    .main-content {
      flex: 1;
      padding: 32px;
      overflow-y: auto;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .header-title h1 {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .header-title p {
      color: var(--text-muted);
      font-size: 14px;
    }

    .header-controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .currency-toggle {
      display: flex;
      gap: 4px;
      background: var(--bg-light);
      padding: 4px;
      border-radius: 8px;
    }

    .currency-btn {
      padding: 8px 16px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .currency-btn.active {
      background: white;
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    /* Search Form */
    .search-form {
      background: var(--bg-white);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 32px;
      box-shadow: var(--shadow);
    }

    .search-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input,
    .form-group select {
      padding: 12px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .search-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      align-self: flex-end;
    }

    .search-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(30, 64, 175, 0.35);
    }

    /* Results Header */
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .results-header h2 {
      font-size: 24px;
      font-weight: 700;
    }

    .sort-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sort-group select {
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      background: var(--bg-white);
      cursor: pointer;
    }

    /* Cars Grid */
    .cars-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }

    /* Car Card */
    .car-card {
      background: var(--bg-white);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.3s ease;
      border: 1px solid var(--border);
      cursor: pointer;
    }

    .car-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-hover);
      border-color: var(--primary);
    }

    .car-image {
      width: 100%;
      height: 160px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      color: white;
      position: relative;
    }

    .car-image.economy {
      background: linear-gradient(135deg, #fa709a, #fee140);
    }

    .car-image.sedan {
      background: linear-gradient(135deg, #4facfe, #00f2fe);
    }

    .car-image.suv {
      background: linear-gradient(135deg, #fa709a, #f5576c);
    }

    .car-image.luxury {
      background: linear-gradient(135deg, #30cfd0, #330867);
    }

    .availability-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #10b981;
      color: white;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
    }

    /* Car Info */
    .car-info {
      padding: 16px;
    }

    .car-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 8px;
    }

    .car-category {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .car-features {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin: 12px 0;
      padding: 12px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .feature {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .feature i {
      color: var(--primary);
      font-size: 14px;
    }

    /* Car Details */
    .car-details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 12px 0;
    }

    .detail-item {
      text-align: center;
    }

    .detail-label {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .detail-value {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
    }

    /* Price Section */
    .car-price {
      margin-top: 12px;
      text-align: right;
    }

    .price-per-day {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .price-amount {
      font-size: 20px;
      font-weight: 800;
      color: var(--primary-dark);
    }

    .price-suffix {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Action Button */
    .book-car-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      margin-top: 12px;
      transition: all 0.3s ease;
    }

    .book-car-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(30, 64, 175, 0.35);
    }

    /* Empty State */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      background: var(--bg-white);
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    .empty-icon {
      font-size: 64px;
      color: #d1d5db;
      margin-bottom: 16px;
    }

    .empty-state h3 {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 8px;
    }

    .empty-state p {
      color: var(--text-muted);
      margin: 0;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .container-layout {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        padding: 16px;
      }

      .main-content {
        padding: 16px;
      }

      .search-grid {
        grid-template-columns: 1fr;
      }

      .cars-container {
        grid-template-columns: 1fr;
      }

      .header-top {
        flex-direction: column;
        gap: 16px;
        align-items: flex-start;
      }

      .results-header {
        flex-direction: column;
        gap: 16px;
        align-items: flex-start;
      }

      .sort-group {
        width: 100%;
      }

      .sort-group select {
        width: 100%;
      }

      .car-features {
        grid-template-columns: repeat(2, 1fr);
      }

      .car-details {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body>
  <div class="container-layout">
    <!-- Left Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <i class="fas fa-plane-departure"></i>
        <span>SmartFly</span>
      </div>

      <nav class="sidebar-nav">
        <a href="flights-booking.html" class="nav-item">
          <i class="fas fa-home"></i>
          <span>Flights</span>
        </a>
        <a href="hotels-booking.html" class="nav-item">
          <i class="fas fa-hotel"></i>
          <span>Hotels</span>
        </a>
        <a href="car-rentals-booking.html" class="nav-item active">
          <i class="fas fa-car"></i>
          <span>Car Rentals</span>
        </a>
        <a href="vacation-packages.html" class="nav-item">
          <i class="fas fa-umbrella-beach"></i>
          <span>Vacation Packages</span>
        </a>
        <a href="#" class="nav-item">
          <i class="fas fa-calendar"></i>
          <span>My Bookings</span>
        </a>
        <a href="#" class="nav-item">
          <i class="fas fa-question-circle"></i>
          <span>Support</span>
        </a>
      </nav>

      <div class="sidebar-profile">
        <div class="profile-avatar">RG</div>
        <div class="profile-info">
          <span class="profile-name">Riley Gabi</span>
          <span class="profile-role">Verified Member</span>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Header with Controls -->
      <div class="header-top">
        <div class="header-title">
          <h1>Rent a Car</h1>
          <p>Choose from our premium selection of vehicles worldwide.</p>
        </div>
        <div class="header-controls">
          <div class="currency-toggle">
            <button class="currency-btn active" onclick="setCurrency('USD')">USD</button>
            <button class="currency-btn" onclick="setCurrency('KSH')">KSH</button>
          </div>
        </div>
      </div>

      <!-- Search Form -->
      <div class="search-form">
        <div class="search-grid">
          <div class="form-group">
            <label>Location</label>
            <input type="text" placeholder="Pick-up location" value="">
          </div>
          <div class="form-group">
            <label>Pick-Up Date</label>
            <input type="date">
          </div>
          <div class="form-group">
            <label>Return Date</label>
            <input type="date">
          </div>
          <div class="form-group">
            <label>Car Type</label>
            <select>
              <option>All Types</option>
              <option>Economy</option>
              <option>Sedan</option>
              <option>SUV</option>
              <option>Luxury</option>
            </select>
          </div>
          <div class="form-group">
            <button class="search-btn">
              <i class="fas fa-search"></i> Search
            </button>
          </div>
        </div>
      </div>

      <!-- Results Header -->
      <div class="results-header">
        <h2>Available Cars</h2>
        <div class="sort-group">
          <select>
            <option>Sort by Price (Low to High)</option>
            <option>Sort by Price (High to Low)</option>
            <option>Sort by Rating</option>
            <option>Sort by Availability</option>
          </select>
        </div>
      </div>

      <!-- Cars Grid -->
      <div class="cars-container" id="carsContainer"></div>
    </main>
  </div>

  <script>
    let currentCurrency = 'USD';
    const exchangeRate = 130; // 1 USD = 130 KSH

    const cars = [
      {
        id: 1,
        name: 'Toyota Corolla',
        type: 'economy',
        category: 'Compact Car',
        priceUSD: 35,
        features: ['Automatic', 'AC', 'Bluetooth', 'Cruise Control'],
        seats: 5,
        transmission: 'Auto',
        available: 12
      },
      {
        id: 2,
        name: 'Honda Accord',
        type: 'sedan',
        category: 'Sedan',
        priceUSD: 55,
        features: ['Automatic', 'Sunroof', 'Bluetooth', 'Parking Sensors'],
        seats: 5,
        transmission: 'Auto',
        available: 8
      },
      {
        id: 3,
        name: 'Toyota RAV4',
        type: 'suv',
        category: 'SUV',
        priceUSD: 75,
        features: ['AWD', 'Sunroof', 'Navigation', 'Backup Camera'],
        seats: 5,
        transmission: 'Auto',
        available: 6
      },
      {
        id: 4,
        name: 'BMW X7',
        type: 'luxury',
        category: 'Luxury SUV',
        priceUSD: 150,
        features: ['AWD', 'Panoramic Roof', 'Premium Audio', 'Leather'],
        seats: 7,
        transmission: 'Auto',
        available: 3
      },
      {
        id: 5,
        name: 'Nissan Altima',
        type: 'sedan',
        category: 'Midsize Sedan',
        priceUSD: 45,
        features: ['Automatic', 'AC', 'Bluetooth', 'USB Port'],
        seats: 5,
        transmission: 'Auto',
        available: 10
      },
      {
        id: 6,
        name: 'Ford Explorer',
        type: 'suv',
        category: 'Full-Size SUV',
        priceUSD: 85,
        features: ['AWD', '3 Rows', 'Tow Package', 'Roof Rack'],
        seats: 7,
        transmission: 'Auto',
        available: 5
      }
    ];

    function setCurrency(currency) {
      currentCurrency = currency;
      document.querySelectorAll('.currency-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');
      renderCars();
    }

    function getPrice(priceUSD) {
      if (currentCurrency === 'USD') return priceUSD;
      return Math.round(priceUSD * exchangeRate);
    }

    function getCurrencySymbol() {
      return currentCurrency === 'USD' ? '$' : 'KSH ';
    }

    function renderCars() {
      const container = document.getElementById('carsContainer');

      if (!cars || cars.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🚗</div>
            <h3>No Cars Found</h3>
            <p>Try adjusting your search criteria</p>
          </div>
        `;
        return;
      }

      container.innerHTML = cars.map(car => `
        <div class="car-card">
          <div class="car-image ${car.type}">
            <i class="fas fa-car"></i>
            <div class="availability-badge">✓ ${car.available} Available</div>
          </div>

          <div class="car-info">
            <div class="car-name">${car.name}</div>
            <div class="car-category">${car.category}</div>

            <div class="car-features">
              ${car.features.map(f => `
                <div class="feature">
                  <i class="fas fa-check"></i>
                  ${f}
                </div>
              `).join('')}
            </div>

            <div class="car-details">
              <div class="detail-item">
                <div class="detail-label">Seats</div>
                <div class="detail-value">${car.seats}</div>
              </div>
              <div class="detail-item">
                <div class="detail-label">Transmission</div>
                <div class="detail-value">${car.transmission}</div>
              </div>
              <div class="detail-item">
                <div class="detail-label">Available</div>
                <div class="detail-value">${car.available}</div>
              </div>
            </div>

            <div class="car-price">
              <div class="price-per-day">Price per day</div>
              <div class="price-amount">${getCurrencySymbol()}${getPrice(car.priceUSD).toLocaleString()}</div>
              <div class="price-suffix">Best Rate Guaranteed</div>
            </div>

            <button class="book-car-btn" onclick="bookCar('${car.name}')">
              <i class="fas fa-check-circle"></i> RENT NOW
            </button>
          </div>
        </div>
      `).join('');
    }

    function bookCar(carName) {
      alert(`Renting ${carName}... Redirecting to payment.`);
    }

    // Render cars on page load
    document.addEventListener('DOMContentLoaded', renderCars);
  </script>
</body>
</html>
