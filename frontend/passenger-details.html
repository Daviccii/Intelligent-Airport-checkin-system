<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passenger Details - SmartFly Airways</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            color: #212121;
        }

        /* Header */
        .header {
            background: white;
            padding: 20px 0;
            border-bottom: 1px solid #e0e0e0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #c8102e;
        }

        .header-title {
            font-size: 16px;
            color: #757575;
        }

        /* Main Container */
        .container {
            max-width: 900px;
            margin: 32px auto;
            padding: 0 24px;
        }

        /* Flight Summary Box */
        .flight-summary {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 32px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .flight-summary-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 24px;
            padding-bottom: 24px;
            border-bottom: 1px solid #eeeeee;
        }

        .flight-summary-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .summary-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .summary-label {
            font-size: 12px;
            font-weight: 600;
            color: #757575;
            text-transform: uppercase;
        }

        .summary-value {
            font-size: 18px;
            font-weight: 700;
            color: #212121;
        }

        .summary-value.price {
            color: #c8102e;
            font-size: 24px;
        }

        /* Form Section */
        .form-section {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .form-section h2 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #212121;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 600;
            color: #212121;
        }

        .form-group input,
        .form-group select {
            padding: 12px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #c8102e;
            box-shadow: 0 0 0 3px rgba(200, 16, 46, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
        }

        /* Action Buttons */
        .actions {
            display: flex;
            gap: 16px;
            padding-top: 24px;
            border-top: 1px solid #eeeeee;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #c8102e;
            color: white;
            flex: 1;
        }

        .btn-primary:hover {
            background: #9e0c24;
        }

        .btn-secondary {
            background: white;
            color: #212121;
            border: 2px solid #e0e0e0;
        }

        .btn-secondary:hover {
            border-color: #c8102e;
            color: #c8102e;
        }

        /* Loading State */
        .loading-message {
            text-align: center;
            padding: 40px;
            color: #757575;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #eeeeee;
            border-top-color: #c8102e;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-content">
            <div class="logo">✈ SmartFly Airways</div>
            <div class="header-title">Passenger Details</div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Flight Summary -->
        <div class="flight-summary" id="flightSummary">
            <div class="flight-summary-row">
                <div class="summary-item">
                    <div class="summary-label">Route</div>
                    <div class="summary-value" id="summaryRoute">—</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">Departure</div>
                    <div class="summary-value" id="summaryDate">—</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">Cabin Class</div>
                    <div class="summary-value" id="summaryClass">—</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">Total Price</div>
                    <div class="summary-value price" id="summaryPrice">Ksh 0</div>
                </div>
            </div>
        </div>

        <!-- Passenger Form -->
        <div class="form-section" id="passengerForm">
            <h2>Passenger Information</h2>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">First Name *</label>
                    <input type="text" id="firstName" required placeholder="John">
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name *</label>
                    <input type="text" id="lastName" required placeholder="Doe">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" required placeholder="john@example.com">
                    <small id="emailError" style="color: #c8102e; display: none; font-size: 12px;">Please enter a valid email address</small>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <input type="tel" id="phone" required placeholder="+254 712 345 678">
                    <small id="phoneError" style="color: #c8102e; display: none; font-size: 12px;">Please enter a valid phone number with country code</small>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="dateOfBirth">Date of Birth *</label>
                    <input type="date" id="dateOfBirth" required>
                </div>
                <div class="form-group">
                    <label for="nationality">Nationality *</label>
                    <select id="nationality" required>
                        <option value="">Select nationality</option>
                        <option value="KE">Kenya</option>
                        <option value="US">United States</option>
                        <option value="GB">United Kingdom</option>
                        <option value="CA">Canada</option>
                        <option value="AU">Australia</option>
                        <option value="NZ">New Zealand</option>
                        <option value="IN">India</option>
                        <option value="ZA">South Africa</option>
                        <option value="NG">Nigeria</option>
                        <option value="GH">Ghana</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="passportNumber">Passport Number *</label>
                    <input type="text" id="passportNumber" required placeholder="A00123456">
                </div>
                <div class="form-group">
                    <label for="passportExpiry">Passport Expiry *</label>
                    <input type="date" id="passportExpiry" required>
                </div>
            </div>

            <div class="actions">
                <button type="button" class="btn btn-secondary" onclick="window.history.back()">Back</button>
                <button type="submit" class="btn btn-primary" onclick="submitPassengerDetails()">Continue to Payment</button>
            </div>
        </div>

        <!-- Loading State (hidden by default) -->
        <div class="loading-message" id="loadingMessage" style="display: none;">
            <div class="spinner"></div>
            <p>Processing your booking...</p>
        </div>
    </div>

    <script>
        // Parse URL parameters
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                from: params.get('from'),
                to: params.get('to'),
                date: params.get('date'),
                fare: params.get('fare'),
                price: params.get('price')
            };
        }

        // Get selected flight from sessionStorage
        function getSelectedFlight() {
            const stored = sessionStorage.getItem('selectedFlight');
            return stored ? JSON.parse(stored) : null;
        }

        // Format date for display
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            return `${months[date.getMonth()]} ${date.getDate()}, ${date.getFullYear()}`;
        }

        // Initialize page
        function initializePage() {
            const params = getUrlParams();
            const flight = getSelectedFlight();

            if (!params.from || !params.to || !params.price) {
                document.getElementById('passengerForm').style.display = 'none';
                document.getElementById('flightSummary').innerHTML = '<p style="color: #c8102e; padding: 24px;">Flight details not found. <a href="/availability.html">Go back to search</a></p>';
                return;
            }

            // Update summary
            document.getElementById('summaryRoute').textContent = `${params.from} → ${params.to}`;
            document.getElementById('summaryDate').textContent = formatDate(params.date);
            document.getElementById('summaryClass').textContent = params.fare.charAt(0).toUpperCase() + params.fare.slice(1);
            const numericPrice = parseFloat(params.price);
            document.getElementById('summaryPrice').textContent = isNaN(numericPrice)
                ? 'Ksh 0'
                : `Ksh ${numericPrice.toLocaleString()}`;

            console.log('🎫 Passenger Details Loaded:', params);
        }

        // Phone number validation with country code detection
        function validatePhoneNumber(phone) {
            // Remove all non-digit characters except + at the start
            const cleaned = phone.replace(/[^\d+]/g, '');
            
            // Check if it starts with + (country code)
            if (!cleaned.startsWith('+')) {
                return { valid: false, message: 'Phone number must start with country code (e.g., +254)' };
            }
            
            // Remove the + and check remaining digits
            const digits = cleaned.substring(1);
            
            // Check if we have enough digits (minimum 8, maximum 15)
            if (digits.length < 8 || digits.length > 15) {
                return { valid: false, message: 'Phone number must have 8-15 digits after country code' };
            }
            
            // Check if all remaining characters are digits
            if (!/^\d+$/.test(digits)) {
                return { valid: false, message: 'Phone number must contain only digits after country code' };
            }
            
            // Common country code patterns
            const countryPatterns = {
                '254': { name: 'Kenya', pattern: /^(254)(7|1)[0-9]{8}$/ },
                '1': { name: 'USA/Canada', pattern: /^(1)[2-9][0-9]{9}$/ },
                '44': { name: 'UK', pattern: /^(44)[1-9][0-9]{9}$/ },
                '27': { name: 'South Africa', pattern: /^(27)[6-8][0-9]{8}$/ },
                '234': { name: 'Nigeria', pattern: /^(234)[7-9][0-9]{8}$/ },
                '233': { name: 'Ghana', pattern: /^(233)[2-9][0-9]{8}$/ },
                '256': { name: 'Uganda', pattern: /^(256)[7-9][0-9]{8}$/ },
                '255': { name: 'Tanzania', pattern: /^(255)[6-7][0-9]{8}$/ },
                '250': { name: 'Rwanda', pattern: /^(250)[7-8][0-9]{8}$/ },
                '251': { name: 'Ethiopia', pattern: /^(251)[9][0-9]{8}$/ }
            };
            
            // Check against known country patterns
            for (const [code, info] of Object.entries(countryPatterns)) {
                if (cleaned.startsWith(code)) {
                    if (info.pattern.test(cleaned)) {
                        return { valid: true, country: info.name };
                    } else {
                        return { valid: false, message: `Invalid ${info.name} phone number format` };
                    }
                }
            }
            
            // If no specific pattern matched but format is valid, accept it
            return { valid: true, country: 'International' };
        }

        // Email validation with domain checking
        function validateEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            
            if (!emailRegex.test(email)) {
                return { valid: false, message: 'Please enter a valid email address' };
            }
            
            // Check for common fake email domains
            const fakeDomains = ['test.com', 'example.com', 'fake.com', 'temp.com', 'throwaway.com'];
            const domain = email.split('@')[1].toLowerCase();
            
            if (fakeDomains.includes(domain)) {
                return { valid: false, message: 'Please use a real email address' };
            }
            
            // Check for common disposable email services
            const disposableDomains = ['tempmail.com', 'guerrillamail.com', 'mailinator.com', '10minutemail.com'];
            if (disposableDomains.some(d => domain.includes(d))) {
                return { valid: false, message: 'Disposable email addresses are not allowed' };
            }
            
            return { valid: true };
        }

        // Submit passenger details
        function submitPassengerDetails() {
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const dateOfBirth = document.getElementById('dateOfBirth').value;
            const nationality = document.getElementById('nationality').value;
            const passportNumber = document.getElementById('passportNumber').value.trim();
            const passportExpiry = document.getElementById('passportExpiry').value;

            // Reset error messages
            document.getElementById('emailError').style.display = 'none';
            document.getElementById('phoneError').style.display = 'none';

            // Validation
            if (!firstName || !lastName || !email || !phone || !dateOfBirth || !nationality || !passportNumber || !passportExpiry) {
                alert('Please fill in all required fields');
                return;
            }

            // Email validation
            const emailValidation = validateEmail(email);
            if (!emailValidation.valid) {
                document.getElementById('emailError').textContent = emailValidation.message;
                document.getElementById('emailError').style.display = 'block';
                document.getElementById('email').style.borderColor = '#c8102e';
                return;
            }

            // Phone validation
            const phoneValidation = validatePhoneNumber(phone);
            if (!phoneValidation.valid) {
                document.getElementById('phoneError').textContent = phoneValidation.message;
                document.getElementById('phoneError').style.display = 'block';
                document.getElementById('phone').style.borderColor = '#c8102e';
                return;
            }

            // Store passenger details
            const passengerDetails = {
                firstName,
                lastName,
                email,
                phone,
                dateOfBirth,
                nationality,
                passportNumber,
                passportExpiry,
                phoneCountry: phoneValidation.country
            };

            console.log('👤 Passenger Details Submitted:', passengerDetails);
            sessionStorage.setItem('passengerDetails', JSON.stringify(passengerDetails));

            // Show loading state
            document.getElementById('passengerForm').style.display = 'none';
            document.getElementById('loadingMessage').style.display = 'block';

            // Simulate processing and redirect with all required parameters
            setTimeout(() => {
                const params = getUrlParams();
                const fullName = `${firstName} ${lastName}`;
                window.location.href = `/payment.html?from=${params.from}&to=${params.to}&price=${params.price}&fare=${params.fare}&name=${encodeURIComponent(fullName)}&email=${encodeURIComponent(email)}&passport=${encodeURIComponent(passportNumber)}&phone=${encodeURIComponent(phone)}`;
            }, 1500);
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', initializePage);

        // Add real-time validation
        document.addEventListener('DOMContentLoaded', () => {
            const emailInput = document.getElementById('email');
            const phoneInput = document.getElementById('phone');

            // Clear email error when user starts typing
            emailInput.addEventListener('input', () => {
                document.getElementById('emailError').style.display = 'none';
                emailInput.style.borderColor = '#e0e0e0';
            });

            // Clear phone error when user starts typing
            phoneInput.addEventListener('input', () => {
                document.getElementById('phoneError').style.display = 'none';
                phoneInput.style.borderColor = '#e0e0e0';
            });
        });
    </script>
</body>
</html>
