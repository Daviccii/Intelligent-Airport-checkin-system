<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SmartFly — Online Check-In</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<style>
  :root {
    --primary-blue: #2563EB;
    --primary-blue-dark: #1E40AF;
    --blue-accent: #3B82F6;
    --blue-light: #EFF6FF;
    --dark-slate: #0F172A;
    --text-main: #1E293B;
    --text-muted: #64748B;
    --bg-light: #F8FAFC;
    --card-bg: #FFFFFF;
    --border-color: #E2E8F0;
    --success: #10B981;
    --success-light: #ECFDF5;
    --error: #EF4444;
    --error-light: #FEF2F2;
    --warning: #F59E0B;
    --warning-light: #FFFBEB;
    --mono: 'IBM Plex Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  body { background: var(--bg-light); color: var(--text-main); min-height: 100vh; }

  .navbar { background: var(--dark-slate); color: #fff; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--primary-blue); }
  .brand-logo { font-size: 1.5rem; font-weight: 700; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 10px; }
  .brand-logo span { color: var(--blue-accent); }
  .nav-links { display: flex; gap: 1.5rem; list-style: none; }
  .nav-links a { color: #CBD5E1; text-decoration: none; font-size: 0.9rem; font-weight: 500; }
  .nav-links a.active { color: var(--blue-accent); }

  .wrap { max-width: 780px; margin: 0 auto; padding: 2rem 1.25rem 5rem; }

  /* Progress rail — this really is a fixed ordered sequence, so numbering earns its keep here */
  .rail { display: flex; align-items: center; gap: 0; margin-bottom: 2rem; overflow-x: auto; padding-bottom: 4px; }
  .rail-step { display: flex; align-items: center; flex-shrink: 0; }
  .rail-dot { width: 26px; height: 26px; border-radius: 50%; background: var(--border-color); color: var(--text-muted); display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 700; flex-shrink: 0; transition: all .25s; }
  .rail-step.done .rail-dot { background: var(--success); color: #fff; }
  .rail-step.current .rail-dot { background: var(--primary-blue); color: #fff; box-shadow: 0 0 0 4px var(--blue-light); }
  .rail-line { width: 20px; height: 2px; background: var(--border-color); flex-shrink: 0; }
  .rail-step.done + .rail-line { background: var(--success); }

  .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); padding: 2rem; }
  @media (max-width: 600px) { .card { padding: 1.25rem; } }

  .card-eyebrow { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--primary-blue); margin-bottom: 0.4rem; }
  .card-title { font-size: 1.35rem; font-weight: 800; color: var(--dark-slate); margin-bottom: 0.35rem; }
  .card-sub { color: var(--text-muted); font-size: 0.92rem; margin-bottom: 1.5rem; line-height: 1.5; }

  .form-group { margin-bottom: 1.1rem; }
  .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.45rem; }
  .form-input { width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--border-color); border-radius: 8px; font-size: 0.98rem; outline: none; transition: border .2s; font-family: var(--mono); letter-spacing: 0.03em; }
  .form-input:not(.mono-off) { text-transform: uppercase; }
  .form-input.mono-off { font-family: 'Inter', sans-serif; text-transform: none; letter-spacing: normal; }
  .form-input:focus { border-color: var(--primary-blue); box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
  .field-error { color: var(--error); font-size: 0.78rem; margin-top: 0.4rem; font-weight: 500; display: none; }
  .form-group.invalid .form-input { border-color: var(--error); background: var(--error-light); }
  .form-group.invalid .field-error { display: block; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; border: none; border-radius: 8px; font-weight: 700; font-size: 0.95rem; padding: 0.85rem 1.5rem; cursor: pointer; transition: background .2s, transform .1s; }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--primary-blue); color: #fff; width: 100%; }
  .btn-primary:hover { background: var(--primary-blue-dark); }
  .btn-primary:disabled { background: #93C5FD; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); }
  .btn-ghost:hover { background: var(--bg-light); }
  .btn-row { display: flex; gap: 0.75rem; margin-top: 1.75rem; }
  .btn-row .btn-primary { flex: 1; }

  /* Outcome banners (not found / pending / too early / too late / already in) */
  .outcome { border-radius: 12px; padding: 1.75rem; text-align: center; }
  .outcome i.big { font-size: 2.25rem; margin-bottom: 0.85rem; display: block; }
  .outcome h3 { font-size: 1.15rem; font-weight: 800; margin-bottom: 0.4rem; }
  .outcome p { color: var(--text-muted); font-size: 0.92rem; line-height: 1.55; }
  .outcome.error { background: var(--error-light); border: 1px solid #FCA5A5; }
  .outcome.error i, .outcome.error h3 { color: var(--error); }
  .outcome.warning { background: var(--warning-light); border: 1px solid #FDE68A; }
  .outcome.warning i, .outcome.warning h3 { color: #B45309; }
  .outcome.success { background: var(--success-light); border: 1px solid #A7F3D0; }
  .outcome.success i, .outcome.success h3 { color: var(--success); }

  .countdown { font-family: var(--mono); font-size: 2rem; font-weight: 700; color: #B45309; margin: 0.75rem 0; letter-spacing: 0.02em; }

  /* Passenger / flight summary grid */
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem 1.5rem; margin: 1.5rem 0; }
  @media (max-width: 560px) { .info-grid { grid-template-columns: 1fr; } }
  .info-item .k { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); font-weight: 700; margin-bottom: 0.25rem; }
  .info-item .v { font-size: 1.02rem; font-weight: 700; color: var(--dark-slate); }
  .info-item .v.route { font-family: var(--mono); }
  .divider { height: 1px; background: var(--border-color); margin: 1.5rem 0; }

  .verify-list { list-style: none; margin: 1rem 0 0.5rem; }
  .verify-list li { display: flex; align-items: center; gap: 0.65rem; padding: 0.6rem 0; border-bottom: 1px solid var(--bg-light); font-size: 0.95rem; }
  .verify-list li:last-child { border-bottom: none; }
  .verify-list i { color: var(--success); }
  .verify-list .val { margin-left: auto; color: var(--text-muted); font-family: var(--mono); font-size: 0.88rem; }

  .notice-box { background: var(--blue-light); border: 1px solid #BFDBFE; border-radius: 10px; padding: 1rem 1.1rem; font-size: 0.85rem; color: var(--primary-blue-dark); margin-top: 1rem; display: flex; gap: 0.6rem; align-items: flex-start; line-height: 1.5; }
  .notice-box i { margin-top: 0.15rem; }

  /* Radio / choice tiles */
  .choice-row { display: flex; gap: 0.85rem; flex-wrap: wrap; }
  .choice-tile { flex: 1; min-width: 110px; border: 2px solid var(--border-color); border-radius: 10px; padding: 1rem; text-align: center; cursor: pointer; font-weight: 700; transition: all .15s; }
  .choice-tile:hover { border-color: var(--blue-accent); }
  .choice-tile.selected { border-color: var(--primary-blue); background: var(--blue-light); color: var(--primary-blue-dark); }
  .choice-tile .sub { display: block; font-weight: 500; font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem; }

  .checkbox-row { display: flex; align-items: flex-start; gap: 0.7rem; padding: 0.55rem 0; font-size: 0.92rem; }
  .checkbox-row input { margin-top: 0.2rem; width: 17px; height: 17px; accent-color: var(--primary-blue); flex-shrink: 0; }
  .dg-list { list-style: none; margin: 0.75rem 0 1rem 0; padding: 0.9rem 1rem; background: var(--bg-light); border-radius: 8px; }
  .dg-list li { font-size: 0.88rem; color: var(--text-main); padding: 0.3rem 0; display: flex; gap: 0.5rem; align-items: center; }
  .dg-list li i { color: var(--warning); width: 16px; }

  /* Seat map */
  .seat-legend { display: flex; gap: 1.25rem; margin-bottom: 1.25rem; font-size: 0.82rem; color: var(--text-muted); flex-wrap: wrap; }
  .seat-legend span { display: inline-flex; align-items: center; gap: 0.4rem; }
  .legend-swatch { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
  .seat-map { display: flex; flex-direction: column; gap: 0.4rem; align-items: center; margin: 0.5rem 0 1.5rem; overflow-x: auto; padding: 0.5rem; }
  .seat-row { display: flex; gap: 0.3rem; align-items: center; }
  .seat-row .row-label { width: 22px; font-size: 0.72rem; color: var(--text-muted); font-family: var(--mono); text-align: right; margin-right: 0.2rem; }
  .seat { width: 34px; height: 34px; border-radius: 7px; border: none; font-size: 0.68rem; font-weight: 700; font-family: var(--mono); cursor: pointer; background: #D1FAE5; color: #065F46; transition: transform .1s; }
  .seat:hover:not(:disabled) { transform: scale(1.08); }
  .seat.occupied { background: #E2E8F0; color: #94A3B8; cursor: not-allowed; }
  .seat.selected { background: var(--primary-blue); color: #fff; box-shadow: 0 0 0 2px var(--primary-blue-dark); }
  .aisle-gap { width: 14px; }
  .seat-selected-readout { text-align: center; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.5rem; }
  .seat-selected-readout b { color: var(--dark-slate); font-family: var(--mono); font-size: 1.1rem; }

  /* Confirmation summary */
  .summary-row { display: flex; justify-content: space-between; padding: 0.65rem 0; border-bottom: 1px dashed var(--border-color); font-size: 0.92rem; }
  .summary-row:last-child { border-bottom: none; }
  .summary-row .k { color: var(--text-muted); }
  .summary-row .v { font-weight: 700; color: var(--dark-slate); }

  /* Boarding pass — ticket stub */
  .pass-wrap { display: flex; justify-content: center; margin: 1rem 0 1.5rem; }
  .pass { width: 100%; max-width: 480px; background: linear-gradient(135deg, var(--dark-slate), #1E293B); color: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 12px 28px -8px rgba(15,23,42,0.35); position: relative; }
  .pass-top { padding: 1.5rem 1.5rem 1rem; }
  .pass-brand { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
  .pass-brand .name { font-weight: 800; font-size: 1.1rem; }
  .pass-brand .name span { color: var(--blue-accent); }
  .pass-brand .class-tag { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; background: rgba(59,130,246,0.25); color: #93C5FD; padding: 0.3rem 0.6rem; border-radius: 5px; }
  .pass-route { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.1rem; }
  .pass-route .city { font-size: 1.6rem; font-weight: 800; font-family: var(--mono); }
  .pass-route .city-name { font-size: 0.7rem; color: #94A3B8; margin-top: 0.2rem; }
  .pass-route .plane-icon { color: var(--blue-accent); font-size: 1.1rem; }
  .pass-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.9rem; margin-bottom: 0.5rem; }
  .pass-grid .k { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.05em; color: #94A3B8; margin-bottom: 0.2rem; }
  .pass-grid .v { font-size: 0.98rem; font-weight: 700; font-family: var(--mono); }
  .pass-tear { position: relative; height: 0; border-top: 2px dashed rgba(255,255,255,0.25); margin: 0.5rem 0; }
  .pass-tear::before, .pass-tear::after { content: ''; position: absolute; top: -11px; width: 22px; height: 22px; background: var(--bg-light); border-radius: 50%; }
  .pass-tear::before { left: -33px; }
  .pass-tear::after { right: -33px; }
  .pass-bottom { padding: 1.1rem 1.5rem 1.5rem; display: flex; align-items: center; gap: 1.25rem; }
  .pass-qr { background: #fff; padding: 8px; border-radius: 8px; flex-shrink: 0; }
  .pass-bottom-info .pnr { font-family: var(--mono); font-size: 1.05rem; font-weight: 700; letter-spacing: 0.04em; }
  .pass-bottom-info .hint { font-size: 0.72rem; color: #94A3B8; margin-top: 0.3rem; line-height: 1.4; }

  .download-row { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 1.5rem; }
  .download-row .btn { flex: 1; min-width: 140px; background: var(--bg-light); color: var(--dark-slate); border: 1px solid var(--border-color); }
  .download-row .btn:hover { background: #EEF2F7; }

  .loading-inline { display: flex; flex-direction: column; align-items: center; gap: 1rem; padding: 3rem 1rem; }
  .spinner { width: 34px; height: 34px; border: 3px solid var(--border-color); border-top-color: var(--primary-blue); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .hidden { display: none !important; }

  @media print {
    .navbar, .rail, .no-print { display: none !important; }
    body { background: #fff; }
    .wrap { max-width: 100%; padding: 0; }
    .pass { box-shadow: none; }
  }
</style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="brand-logo"><i class="fa-solid fa-plane-up"></i> Smart<span>Fly</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="flight-search.html">Book Flight</a></li>
      <li><a href="my-bookings.html">My Bookings</a></li>
      <li><a href="check-in.html" class="active">Check-in</a></li>
    </ul>
  </nav>

  <div class="wrap">
    <div class="rail" id="rail"></div>
    <div id="wizard-root">
      <div class="card"><div class="loading-inline"><div class="spinner"></div><p style="color:var(--text-muted); font-size:0.9rem;">Loading check-in system…</p></div></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="checkin-validation.js" defer></script>
</body>
</html>
