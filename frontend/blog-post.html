<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Blog — SmartFly</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="main-nav"><div class="container nav-container">
    <div class="logo-container">
      <div class="logo"><svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg></div>
      <div class="brand"><h2 class="logo-text">SmartFly</h2><p class="site-vision">your journey starts here</p></div>
    </div>
    <div class="header-right">
      <nav class="header-tabs">
        <a class="tab-link" href="index.html">Home</a>
        <a class="tab-link" href="help.html">Help</a>
      </nav>
    </div></div></nav>

  <main class="page-container" style="margin-top:90px">
    <article class="card" style="padding:0; overflow:hidden">
      <div id="heroImg" style="height:320px; background:#ddd; background-size:cover; background-position:center"></div>
      <div style="padding:18px 18px 6px 18px">
        <p id="postTag" class="muted" style="margin:0 0 6px 0; font-weight:600"></p>
        <h1 id="postTitle" style="margin:0 0 10px 0">Blog Title</h1>
        <p id="postExcerpt" class="muted" style="margin:0 0 14px 0"></p>
      </div>
      <div id="postBody" style="padding: 0 18px 18px 18px; line-height:1.7"></div>
      <div style="padding:0 18px 18px 18px; display:flex; gap:10px; flex-wrap:wrap">
        <a class="btn" href="index.html">Back to Home</a>
        <a class="btn" href="destinations.html">Explore Destinations</a>
      </div>
    </article>
  </main>

  <script>
    (function(){
      const POSTS = {
        'lounge': {
          tag: 'Tips',
          title: 'Maximize your airport time: lounges we love',
          image: 'https://images.unsplash.com/photo-1529078155058-5d716f45d604?auto=format&fit=crop&w=1600&q=60',
          excerpt: 'Our picks for the most relaxing spaces to recharge before takeoff.',
          body: [
            'Airport lounges can transform your journey—from quiet workspaces to premium snacks and showers. We rounded up a few favorites that consistently deliver comfort and convenience.',
            'Look for lounges with plentiful power outlets, consistent Wi‑Fi, and different zones for work, dining, and naps. When in doubt, earlier access means more time to reset before your flight.'
          ]
        },
        'family-travel': {
          tag: 'Guide',
          title: 'Flying with kids: pro tips',
          image: 'https://images.unsplash.com/photo-1511895426328-dc8714191300?auto=format&fit=crop&w=1600&q=60',
          excerpt: 'Seat choices, bag hacks and keeping everyone smiling.',
          body: [
            'Choose seats close to restrooms and keep essentials handy. Pack light distractions—coloring, audiobooks, a favorite snack—to smooth out the time between activities.',
            'Board early if available, and consider splitting responsibilities so one adult preps the seats while the other handles boarding with the kids.'
          ]
        },
        'eco-trips': {
          tag: 'Inspiration',
          title: 'Eco-friendly trips to try',
          image: 'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=60',
          excerpt: 'Low-impact getaways that don’t skimp on wonder.',
          body: [
            'From Costa Rica’s rainforests to Iceland’s geothermal wonders, eco-travel can be both awe-inspiring and responsible. Support local guides and choose operators with strong conservation practices.',
            'Offset your carbon footprint and opt for rail or shuttle connections where available to reduce impact.'
          ]
        }
      };
      const params = new URLSearchParams(location.search||'');
      const slug = (params.get('slug')||'').toLowerCase();
      const post = POSTS[slug] || POSTS['lounge'];
      document.getElementById('heroImg').style.backgroundImage = `url(${post.image})`;
      document.getElementById('postTag').textContent = post.tag;
      document.getElementById('postTitle').textContent = post.title;
      document.getElementById('postExcerpt').textContent = post.excerpt;
      document.getElementById('postBody').innerHTML = post.body.map(p=>`<p>${p}</p>`).join('');
    })();
  </script>
</body>
</html>
