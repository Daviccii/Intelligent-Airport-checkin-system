<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vacation Packages &mdash; SmartFly Airlines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-dark: #1e40af;
      --primary: #3b82f6;
      --secondary: #60a5fa;
      --accent-red: #ef4444;
      --success: #16a34a;
      --text-dark: #1f2937;
      --text-muted: #6b7280;
      --bg-light: #f3f4f6;
      --bg-white: #ffffff;
      --border: #e5e7eb;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      --shadow-hover: 0 16px 40px rgba(0, 0, 0, 0.18);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background: #f9fafb;
      color: var(--text-dark);
    }

    .container-layout {
      display: flex;
      min-height: 100vh;
    }

    /* ===================== SIDEBAR ===================== */
    .sidebar {
      width: 280px;
      background: linear-gradient(180deg, var(--primary-dark) 0%, #1e3a8a 100%);
      color: white;
      padding: 28px 20px;
      flex-shrink: 0;
      overflow-y: auto;
      box-shadow: 6px 0 24px rgba(0, 0, 0, 0.15);
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      font-weight: 700;
      font-size: 18px;
    }

    .sidebar-logo i {
      font-size: 24px;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 32px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
      border-radius: 10px;
      font-weight: 500;
      font-size: 14px;
      transition: all 0.25s ease;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.15);
      color: white;
    }

    .nav-item.active {
      background: rgba(255, 255, 255, 0.25);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.35);
    }

    .nav-item i {
      font-size: 16px;
    }

    .sidebar-profile {
      margin-top: auto;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .profile-avatar {
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: white;
    }

    .profile-info {
      display: flex;
      flex-direction: column;
      font-size: 13px;
    }

    .profile-name {
      font-weight: 600;
      color: white;
    }

    .profile-role {
      color: rgba(255, 255, 255, 0.7);
    }

    /* ===================== MAIN CONTENT ===================== */
    .main-content {
      flex: 1;
      padding: 32px;
      overflow-y: auto;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .header-title h1 {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .header-title p {
      color: var(--text-muted);
      font-size: 14px;
    }

    .header-controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .currency-toggle {
      display: flex;
      gap: 4px;
      background: var(--bg-light);
      padding: 4px;
      border-radius: 8px;
    }

    .currency-btn {
      padding: 8px 16px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .currency-btn.active {
      background: white;
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    /* Filter Form */
    .filter-form {
      background: var(--bg-white);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 32px;
      box-shadow: var(--shadow);
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input,
    .form-group select {
      padding: 12px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .filter-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      align-self: flex-end;
    }

    .filter-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(30, 64, 175, 0.35);
    }

    /* Results Header */
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .results-header h2 {
      font-size: 24px;
      font-weight: 700;
    }

    .sort-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sort-group select {
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      background: var(--bg-white);
      cursor: pointer;
    }

    /* Packages Grid */
    .packages-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 28px;
    }

    /* Package Card */
    .package-card {
      background: var(--bg-white);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.3s ease;
      border: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .package-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-hover);
      border-color: var(--primary);
    }

    .package-image {
      width: 100%;
      height: 200px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      color: white;
      position: relative;
      overflow: hidden;
    }

    .package-image.beach {
      background: linear-gradient(135deg, #f093fb, #f5576c);
    }

    .package-image.adventure {
      background: linear-gradient(135deg, #4facfe, #00f2fe);
    }

    .package-image.cultural {
      background: linear-gradient(135deg, #fa709a, #fee140);
    }

    .package-image.luxury {
      background: linear-gradient(135deg, #30cfd0, #330867);
    }

    .discount-label {
      position: absolute;
      top: 12px;
      right: 12px;
      background: var(--accent-red);
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
    }

    /* Package Info */
    .package-info {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .package-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 8px;
    }

    .package-destination {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 12px;
    }

    .package-description {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .package-highlights {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 16px 0;
      padding: 12px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .highlight {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-dark);
      font-weight: 500;
    }

    .highlight i {
      color: var(--success);
      font-size: 14px;
    }

    /* Package Details */
    .package-details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin: 12px 0;
    }

    .detail-item {
      background: var(--bg-light);
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }

    .detail-label {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .detail-value {
      font-size: 15px;
      font-weight: 700;
      color: var(--primary);
    }

    /* Price Section */
    .package-price {
      margin-top: auto;
      padding-top: 16px;
    }

    .original-price {
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: line-through;
      margin-bottom: 4px;
    }

    .price-amount {
      font-size: 26px;
      font-weight: 800;
      color: var(--primary-dark);
      margin-bottom: 2px;
    }

    .price-suffix {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Action Button */
    .book-package-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      padding: 13px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      margin-top: 16px;
      transition: all 0.3s ease;
    }

    .book-package-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(30, 64, 175, 0.35);
    }

    /* Empty State */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      background: var(--bg-white);
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    .empty-icon {
      font-size: 64px;
      color: #d1d5db;
      margin-bottom: 16px;
    }

    .empty-state h3 {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 8px;
    }

    .empty-state p {
      color: var(--text-muted);
      margin: 0;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .container-layout {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        padding: 16px;
      }

      .main-content {
        padding: 16px;
      }

      .filter-grid {
        grid-template-columns: 1fr;
      }

      .packages-container {
        grid-template-columns: 1fr;
      }

      .header-top {
        flex-direction: column;
        gap: 16px;
        align-items: flex-start;
      }

      .results-header {
        flex-direction: column;
        gap: 16px;
        align-items: flex-start;
      }

      .sort-group {
        width: 100%;
      }

      .sort-group select {
        width: 100%;
      }

      .package-details {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body>
  <div class="container-layout">
    <!-- Left Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <i class="fas fa-plane-departure"></i>
        <span>SmartFly</span>
      </div>

      <nav class="sidebar-nav">
        <a href="flights-booking.html" class="nav-item">
          <i class="fas fa-home"></i>
          <span>Flights</span>
        </a>
        <a href="hotels-booking.html" class="nav-item">
          <i class="fas fa-hotel"></i>
          <span>Hotels</span>
        </a>
        <a href="car-rentals-booking.html" class="nav-item">
          <i class="fas fa-car"></i>
          <span>Car Rentals</span>
        </a>
        <a href="vacation-packages.html" class="nav-item active">
          <i class="fas fa-umbrella-beach"></i>
          <span>Vacation Packages</span>
        </a>
        <a href="#" class="nav-item">
          <i class="fas fa-calendar"></i>
          <span>My Bookings</span>
        </a>
        <a href="#" class="nav-item">
          <i class="fas fa-question-circle"></i>
          <span>Support</span>
        </a>
      </nav>

      <div class="sidebar-profile">
        <div class="profile-avatar">RG</div>
        <div class="profile-info">
          <span class="profile-name">Riley Gabi</span>
          <span class="profile-role">Verified Member</span>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Header with Controls -->
      <div class="header-top">
        <div class="header-title">
          <h1>Vacation Packages</h1>
          <p>Explore curated travel packages worldwide.</p>
        </div>
        <div class="header-controls">
          <div class="currency-toggle">
            <button class="currency-btn active" onclick="setCurrency('USD')">USD</button>
            <button class="currency-btn" onclick="setCurrency('KSH')">KSH</button>
          </div>
        </div>
      </div>

      <!-- Filter Form -->
      <div class="filter-form">
        <div class="filter-grid">
          <div class="form-group">
            <label>Destination</label>
            <select>
              <option>All Destinations</option>
              <option>Beach</option>
              <option>Adventure</option>
              <option>Cultural</option>
              <option>Luxury</option>
            </select>
          </div>
          <div class="form-group">
            <label>Duration</label>
            <select>
              <option>Any Duration</option>
              <option>3-5 Days</option>
              <option>5-7 Days</option>
              <option>7-10 Days</option>
              <option>10+ Days</option>
            </select>
          </div>
          <div class="form-group">
            <label>Budget</label>
            <select>
              <option>Any Budget</option>
              <option>Under $1000</option>
              <option>$1000 - $2000</option>
              <option>$2000 - $5000</option>
              <option>$5000+</option>
            </select>
          </div>
          <div class="form-group">
            <button class="filter-btn">
              <i class="fas fa-search"></i> Filter
            </button>
          </div>
        </div>
      </div>

      <!-- Results Header -->
      <div class="results-header">
        <h2>Popular Packages</h2>
        <div class="sort-group">
          <select>
            <option>Sort by Price (Low to High)</option>
            <option>Sort by Price (High to Low)</option>
            <option>Sort by Rating</option>
            <option>Sort by Popularity</option>
          </select>
        </div>
      </div>

      <!-- Packages Grid -->
      <div class="packages-container" id="packagesContainer"></div>
    </main>
  </div>

  <script>
    let currentCurrency = 'USD';
    const exchangeRate = 130; // 1 USD = 130 KSH

    const packages = [
      {
        id: 1,
        name: 'Maldives Paradise',
        destination: 'Maldives',
        type: 'beach',
        description: 'Enjoy pristine beaches and crystal-clear waters',
        originalPriceUSD: 1800,
        priceUSD: 1500,
        discount: 17,
        days: 5,
        highlights: ['All-inclusive meals', 'Spa treatments', 'Water sports', 'Private beach'],
        rating: 4.9,
        reviews: 324
      },
      {
        id: 2,
        name: 'Swiss Alps Adventure',
        destination: 'Switzerland',
        type: 'adventure',
        description: 'Experience mountain hiking and outdoor activities',
        originalPriceUSD: 2200,
        priceUSD: 1899,
        discount: 14,
        days: 7,
        highlights: ['Guided hikes', 'Cable car tours', 'Alpine lodge', 'Equipment rental'],
        rating: 4.8,
        reviews: 287
      },
      {
        id: 3,
        name: 'Egyptian Wonder',
        destination: 'Egypt',
        type: 'cultural',
        description: 'Explore ancient temples and historical sites',
        originalPriceUSD: 1200,
        priceUSD: 999,
        discount: 17,
        days: 6,
        highlights: ['Pyramid tours', 'Nile cruise', 'Museum visits', 'Local guides'],
        rating: 4.7,
        reviews: 456
      },
      {
        id: 4,
        name: 'Dubai Luxury Escape',
        destination: 'UAE',
        type: 'luxury',
        description: 'Experience ultimate luxury and modern architecture',
        originalPriceUSD: 3500,
        priceUSD: 2999,
        discount: 14,
        days: 4,
        highlights: ['5-star hotels', 'Yacht cruise', 'Shopping spree', 'Desert safari'],
        rating: 5.0,
        reviews: 512
      },
      {
        id: 5,
        name: 'Bali Beach Getaway',
        destination: 'Indonesia',
        type: 'beach',
        description: 'Relax on tropical beaches and explore rice terraces',
        originalPriceUSD: 1100,
        priceUSD: 899,
        discount: 18,
        days: 5,
        highlights: ['Beach resorts', 'Temple tours', 'Yoga classes', 'Island hopping'],
        rating: 4.6,
        reviews: 678
      },
      {
        id: 6,
        name: 'Japan Cultural Tour',
        destination: 'Japan',
        type: 'cultural',
        description: 'Discover ancient traditions and modern cities',
        originalPriceUSD: 2400,
        priceUSD: 1999,
        discount: 17,
        days: 8,
        highlights: ['Temple visits', 'Cherry blossoms', 'Train passes', 'Local cuisine'],
        rating: 4.9,
        reviews: 389
      }
    ];

    function setCurrency(currency) {
      currentCurrency = currency;
      document.querySelectorAll('.currency-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');
      renderPackages();
    }

    function getPrice(priceUSD) {
      if (currentCurrency === 'USD') return priceUSD;
      return Math.round(priceUSD * exchangeRate);
    }

    function getCurrencySymbol() {
      return currentCurrency === 'USD' ? '$' : 'KSH ';
    }

    function renderPackages() {
      const container = document.getElementById('packagesContainer');

      if (!packages || packages.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🏖️</div>
            <h3>No Packages Found</h3>
            <p>Try adjusting your filters</p>
          </div>
        `;
        return;
      }

      container.innerHTML = packages.map(pkg => `
        <div class="package-card">
          <div class="package-image ${pkg.type}">
            <i class="fas fa-umbrella-beach"></i>
            <div class="discount-label">${pkg.discount}% OFF</div>
          </div>

          <div class="package-info">
            <div class="package-name">${pkg.name}</div>
            <div class="package-destination">
              <i class="fas fa-map-marker-alt"></i>
              ${pkg.destination}
            </div>
            <div class="package-description">${pkg.description}</div>

            <div class="package-highlights">
              ${pkg.highlights.map(h => `
                <div class="highlight">
                  <i class="fas fa-check"></i>
                  ${h}
                </div>
              `).join('')}
            </div>

            <div class="package-details">
              <div class="detail-item">
                <div class="detail-label">Duration</div>
                <div class="detail-value">${pkg.days} Days</div>
              </div>
              <div class="detail-item">
                <div class="detail-label">Rating</div>
                <div class="detail-value">⭐ ${pkg.rating}</div>
              </div>
            </div>

            <div class="package-price">
              <div class="original-price">${getCurrencySymbol()}${getPrice(pkg.originalPriceUSD).toLocaleString()}</div>
              <div class="price-amount">${getCurrencySymbol()}${getPrice(pkg.priceUSD).toLocaleString()}</div>
              <div class="price-suffix">${pkg.reviews} reviews</div>
            </div>

            <button class="book-package-btn" onclick="bookPackage('${pkg.name}')">
              <i class="fas fa-check-circle"></i> BOOK NOW
            </button>
          </div>
        </div>
      `).join('');
    }

    function bookPackage(packageName) {
      alert(`Booking ${packageName}... Redirecting to payment.`);
    }

    // Render packages on page load
    document.addEventListener('DOMContentLoaded', renderPackages);
  </script>
</body>
</html>
