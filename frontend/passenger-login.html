<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passenger Login - SmartFly Airlines</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Poppins', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* Animated background */
    .animated-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #4facfe 100%);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      z-index: -2;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Floating elements */
    .floating-element {
      position: fixed;
      opacity: 0.1;
      pointer-events: none;
      z-index: -1;
    }

    .floating-element-1 {
      width: 300px;
      height: 300px;
      background: white;
      border-radius: 50%;
      top: -50px;
      right: -50px;
      animation: float 20s ease-in-out infinite;
    }

    .floating-element-2 {
      width: 200px;
      height: 200px;
      background: white;
      border-radius: 50%;
      bottom: 10%;
      left: -30px;
      animation: float 25s ease-in-out infinite reverse;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    /* Container */
    .login-container {
      max-width: 450px;
      width: 100%;
      margin: 20px;
      z-index: 10;
    }

    /* Card styling */
    .login-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      animation: slideUp 0.6s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Header */
    .login-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 40px 30px;
      text-align: center;
      color: white;
    }

    .brand-logo {
      font-size: 48px;
      margin-bottom: 15px;
      display: inline-flex;
      width: 80px;
      height: 80px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 15px;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      animation: scaleIn 0.6s ease;
    }

    @keyframes scaleIn {
      from {
        transform: scale(0.8);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .login-header h1 {
      font-size: 32px;
      font-weight: 800;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      letter-spacing: -0.5px;
    }

    .login-header p {
      font-size: 14px;
      opacity: 0.9;
      margin-top: 8px;
    }

    /* Form container */
    .login-form {
      padding: 40px;
    }

    /* Form groups */
    .form-group {
      margin-bottom: 24px;
      animation: fadeInUp 0.6s ease;
      animation-fill-mode: both;
    }

    .form-group:nth-child(1) { animation-delay: 0.1s; }
    .form-group:nth-child(2) { animation-delay: 0.2s; }
    .form-group:nth-child(3) { animation-delay: 0.3s; }
    .form-group:nth-child(4) { animation-delay: 0.4s; }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .form-label {
      font-weight: 600;
      color: #0a0e27;
      font-size: 14px;
      margin-bottom: 8px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .form-control {
      border: 2px solid #e9ecef;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 14px;
      transition: all 0.3s ease;
      background: #f8f9fa;
    }

    .form-control:focus {
      border-color: #667eea;
      background: white;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      outline: none;
    }

    .form-control::placeholder {
      color: #6c757d;
    }

    /* Remember me checkbox */
    .form-check {
      margin-bottom: 20px;
    }

    .form-check-input {
      border-radius: 5px;
      border: 2px solid #e9ecef;
      width: 20px;
      height: 20px;
      cursor: pointer;
      margin-top: 3px;
    }

    .form-check-input:checked {
      background-color: #667eea;
      border-color: #667eea;
    }

    .form-check-label {
      color: #6c757d;
      font-size: 14px;
      cursor: pointer;
      margin-left: 8px;
    }

    /* Login button */
    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
      animation: fadeInUp 0.6s ease;
      animation-delay: 0.5s;
      animation-fill-mode: both;
    }

    .btn-login:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(102, 126, 234, 0.4);
    }

    .btn-login:active {
      transform: translateY(-1px);
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      margin: 30px 0;
      opacity: 0.6;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e9ecef;
    }

    .divider span {
      padding: 0 15px;
      font-size: 13px;
      color: #6c757d;
      font-weight: 600;
    }

    /* Social login */
    .social-login {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }

    .btn-social {
      padding: 12px;
      border: 2px solid #e9ecef;
      background: white;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-social:hover {
      border-color: #667eea;
      background: #f8f9fa;
    }

    /* Footer */
    .login-footer {
      padding: 20px 30px;
      text-align: center;
      border-top: 1px solid #e9ecef;
      background: #f8f9fa;
    }

    .login-footer p {
      font-size: 14px;
      color: #6c757d;
      margin: 0;
    }

    .login-footer a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
    }

    .login-footer a:hover {
      color: #764ba2;
      text-decoration: underline;
    }

    /* Error message */
    .error-message {
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      color: #721c24;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      font-size: 14px;
    }

    .error-message.show {
      display: block;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Success message */
    .success-message {
      background: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      font-size: 14px;
    }

    .success-message.show {
      display: block;
      animation: slideDown 0.3s ease;
    }

    /* Forgot password link */
    .forgot-password {
      text-align: right;
      margin-bottom: 20px;
    }

    .forgot-password a {
      color: #667eea;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: color 0.3s ease;
    }

    .forgot-password a:hover {
      color: #764ba2;
    }

    /* Tab navigation */
    .login-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      border-bottom: 2px solid #e9ecef;
    }

    .tab-btn {
      padding: 12px 20px;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: #6c757d;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .tab-btn.active {
      color: #667eea;
      border-bottom-color: #667eea;
    }

    .tab-btn:hover:not(.active) {
      color: #0a0e27;
    }

    /* Tab content */
    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .login-container {
        margin: 10px;
      }

      .login-card {
        border-radius: 16px;
      }

      .login-header {
        padding: 30px 20px;
      }

      .login-header h1 {
        font-size: 26px;
      }

      .brand-logo {
        width: 70px;
        height: 70px;
        font-size: 40px;
      }

      .login-form {
        padding: 30px 20px;
      }

      .social-login {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="animated-bg"></div>
  <div class="floating-element floating-element-1"></div>
  <div class="floating-element floating-element-2"></div>

  <div class="login-container">
    <div class="login-card">
      <!-- Header -->
      <div class="login-header">
        <div class="brand-logo">
          <i class="fas fa-plane-departure"></i>
        </div>
        <h1>SmartFly</h1>
        <p>Passenger Portal</p>
      </div>

      <!-- Login Form -->
      <div class="login-form">
        <!-- Tab Navigation -->
        <div class="login-tabs">
          <button class="tab-btn active" onclick="switchTab('login')">
            <i class="fas fa-sign-in-alt me-2"></i>Login
          </button>
          <button class="tab-btn" onclick="switchTab('register')">
            <i class="fas fa-user-plus me-2"></i>Sign Up
          </button>
        </div>

        <!-- Error/Success Messages -->
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <!-- Login Tab -->
        <div class="tab-content active" id="login-tab">
          <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
              <label class="form-label" for="email">Email Address</label>
              <input 
                type="email" 
                class="form-control" 
                id="email" 
                name="email"
                placeholder="Enter your email"
                required
              >
            </div>

            <div class="form-group">
              <label class="form-label" for="password">Password</label>
              <input 
                type="password" 
                class="form-control" 
                id="password" 
                name="password"
                placeholder="Enter your password"
                required
              >
            </div>

            <div class="form-check">
              <input 
                type="checkbox" 
                class="form-check-input" 
                id="rememberMe"
                name="rememberMe"
              >
              <label class="form-check-label" for="rememberMe">
                Remember me for 30 days
              </label>
            </div>

            <button type="submit" class="btn-login">
              <i class="fas fa-sign-in-alt me-2"></i>Sign In
            </button>
          </form>

          <div class="divider">
            <span>Or continue with</span>
          </div>

          <div class="social-login">
            <button class="btn-social" onclick="loginWithGoogle()">
              <i class="fab fa-google"></i>Google
            </button>
            <button class="btn-social" onclick="loginWithApple()">
              <i class="fab fa-apple"></i>Apple
            </button>
          </div>

          <div class="forgot-password">
            <a href="#forgot-password">Forgot password?</a>
          </div>
        </div>

        <!-- Register Tab -->
        <div class="tab-content" id="register-tab">
          <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
              <label class="form-label" for="fullName">Full Name</label>
              <input 
                type="text" 
                class="form-control" 
                id="fullName" 
                name="fullName"
                placeholder="Enter your full name"
                required
              >
            </div>

            <div class="form-group">
              <label class="form-label" for="registerEmail">Email Address</label>
              <input 
                type="email" 
                class="form-control" 
                id="registerEmail" 
                name="registerEmail"
                placeholder="Enter your email"
                required
              >
            </div>

            <div class="form-group">
              <label class="form-label" for="phone">Phone Number</label>
              <input 
                type="tel" 
                class="form-control" 
                id="phone" 
                name="phone"
                placeholder="Enter your phone number"
                required
              >
            </div>

            <div class="form-group">
              <label class="form-label" for="registerPassword">Password</label>
              <input 
                type="password" 
                class="form-control" 
                id="registerPassword" 
                name="registerPassword"
                placeholder="Create a strong password"
                required
              >
            </div>

            <div class="form-group">
              <label class="form-label" for="confirmPassword">Confirm Password</label>
              <input 
                type="password" 
                class="form-control" 
                id="confirmPassword" 
                name="confirmPassword"
                placeholder="Confirm your password"
                required
              >
            </div>

            <div class="form-check">
              <input 
                type="checkbox" 
                class="form-check-input" 
                id="agreeTerms"
                name="agreeTerms"
                required
              >
              <label class="form-check-label" for="agreeTerms">
                I agree to the <a href="#terms" style="color: #667eea;">Terms of Service</a>
              </label>
            </div>

            <button type="submit" class="btn-login">
              <i class="fas fa-user-plus me-2"></i>Create Account
            </button>
          </form>
        </div>
      </div>

      <!-- Footer -->
      <div class="login-footer">
        <p>
          Don't have an account? 
          <a href="#signup" onclick="switchTab('register')">Sign up here</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    // Tab switching
    function switchTab(tab) {
      // Hide all tabs
      document.querySelectorAll('.tab-content').forEach(content => {
        content.classList.remove('active');
      });
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
      });

      // Show selected tab
      document.getElementById(tab + '-tab').classList.add('active');
      event.target.classList.add('active');

      // Clear messages
      clearMessages();
    }

    // Handle login
    function handleLogin(event) {
      event.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const rememberMe = document.getElementById('rememberMe').checked;

      // Simple validation
      if (!email || !password) {
        showError('Please fill in all fields');
        return;
      }

      if (!email.includes('@')) {
        showError('Please enter a valid email address');
        return;
      }

      if (password.length < 6) {
        showError('Password must be at least 6 characters');
        return;
      }

      // Simulate login (in production, this would call an API)
      showSuccess('Login successful! Redirecting...');
      
      // Store credentials if remember me is checked
      if (rememberMe) {
        localStorage.setItem('rememberEmail', email);
      }

      // Redirect after 1.5 seconds
      setTimeout(() => {
        window.location.href = 'passenger-portal.html';
      }, 1500);
    }

    // Handle registration
    function handleRegister(event) {
      event.preventDefault();

      const fullName = document.getElementById('fullName').value;
      const email = document.getElementById('registerEmail').value;
      const phone = document.getElementById('phone').value;
      const password = document.getElementById('registerPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const agreeTerms = document.getElementById('agreeTerms').checked;

      // Validation
      if (!fullName || !email || !phone || !password || !confirmPassword) {
        showError('Please fill in all fields');
        return;
      }

      if (!email.includes('@')) {
        showError('Please enter a valid email address');
        return;
      }

      if (password.length < 8) {
        showError('Password must be at least 8 characters');
        return;
      }

      if (password !== confirmPassword) {
        showError('Passwords do not match');
        return;
      }

      if (!agreeTerms) {
        showError('Please agree to the terms of service');
        return;
      }

      // Simulate registration
      showSuccess('Account created successfully! Logging in...');

      // Auto-login after registration
      setTimeout(() => {
        window.location.href = 'passenger-portal.html';
      }, 1500);
    }

    // Social login handlers
    function loginWithGoogle() {
      showSuccess('Redirecting to Google...');
      // In production, implement OAuth flow
      setTimeout(() => {
        window.location.href = 'passenger-portal.html';
      }, 1000);
    }

    function loginWithApple() {
      showSuccess('Redirecting to Apple...');
      // In production, implement OAuth flow
      setTimeout(() => {
        window.location.href = 'passenger-portal.html';
      }, 1000);
    }

    // Show error message
    function showError(message) {
      const errorEl = document.getElementById('errorMessage');
      errorEl.textContent = message;
      errorEl.classList.add('show');
    }

    // Show success message
    function showSuccess(message) {
      const successEl = document.getElementById('successMessage');
      successEl.textContent = message;
      successEl.classList.add('show');
    }

    // Clear messages
    function clearMessages() {
      document.getElementById('errorMessage').classList.remove('show');
      document.getElementById('successMessage').classList.remove('show');
    }

    // Restore remembered email
    window.addEventListener('DOMContentLoaded', () => {
      const rememberEmail = localStorage.getItem('rememberEmail');
      if (rememberEmail) {
        document.getElementById('email').value = rememberEmail;
        document.getElementById('rememberMe').checked = true;
      }
    });
  </script>
</body>
</html>
