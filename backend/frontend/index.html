<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Airport Checkin - Search</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 16px; }
    .search-row { display:flex; gap:8px; align-items:center; margin-bottom:12px; }
    .search-row input { padding:8px; font-size:14px; }
    .search-btn { display:inline-flex; align-items:center; gap:8px; padding:8px 12px; font-weight:600; cursor:pointer; }
    .offers { margin-top:16px; }
    .airline-box { border:1px solid #ddd; padding:8px; margin-top:8px; border-radius:6px; background:#fff }
    .dates-panel a { display:inline-block; margin:4px; padding:6px 8px; border-radius:6px; text-decoration:none; color:#111 }
  </style>
  <style>
    /* Autocomplete suggestions */
    .airport-sugg { position: absolute; background:#fff; border:1px solid #e6eef6; box-shadow:0 8px 20px rgba(3,10,25,0.08); border-radius:8px; overflow:auto; max-height:260px; z-index:9999; width:360px; }
    .airport-sugg .item { padding:8px 10px; cursor:pointer; border-bottom:1px solid #f4f7fb; }
    .airport-sugg .item:last-child { border-bottom:none }
    .airport-sugg .item:hover, .airport-sugg .item.active { background:#f3fbff; }
    .airport-field { position:relative; }
  </style>
</head>
<body>
  <h1>Search Flights</h1>
  <form id="searchForm" onsubmit="return false;">
    <div class="search-row">
      <input id="originInput" name="origin" placeholder="Origin (IATA) e.g. JFK" />
      <input id="destInput" name="dest" placeholder="Destination (IATA) e.g. LHR" />
      <input id="startInput" name="start" type="date" />
      <input id="endInput" name="end" type="date" />
      <button id="searchBtn" class="search-btn" title="Search flights" aria-label="Search flights">Search flights</button>
    </div>
  </form>

  <div id="offers-container" class="offers"></div>

  <div id="flights-container" class="offers"></div>

  <script>
  // Offers UI and fetch logic (uses /api/prices/offers)
  function renderOffers(data) {
    const c = document.getElementById('offers-container');
    c.innerHTML = '';

    const hdr = document.createElement('div');
    hdr.innerHTML = `<strong>Route</strong>: ${data.from} → ${data.to} • Base ${data.currency} ${data.base}`;
    c.appendChild(hdr);

    // If alternatives exist, render those exclusively and skip the per-airline flights list
    if (data.alternatives && data.alternatives.length) {
      try {
        c.innerHTML = '';
        const tabs = document.createElement('div');
        tabs.style.display = 'flex';
        tabs.style.flexWrap = 'wrap';
        tabs.style.gap = '12px';
        tabs.style.marginTop = '12px';

        data.alternatives.forEach(a => {
          const card = document.createElement('a');
          const href = (a.booking_url_template ? a.booking_url_template.replace('{date}', encodeURIComponent(Object.keys(data.days || {})[0] || '')) : (a.booking_url || '#'));
          card.href = href;
          card.target = '_blank';
          card.className = 'alt-card';
          card.style.display = 'flex';
          card.style.flexDirection = 'column';
          card.style.justifyContent = 'flex-end';
          card.style.width = '280px';
          card.style.height = '140px';
          card.style.borderRadius = '8px';
          card.style.overflow = 'hidden';
          card.style.position = 'relative';
          card.style.color = '#fff';
          card.style.textDecoration = 'none';
          card.style.boxShadow = '0 6px 20px rgba(0,0,0,0.12)';

          const bg = a.logo_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(a.airline || '')}&size=512`;
          try { card.style.backgroundImage = `linear-gradient(to top, rgba(0,0,0,0.56), rgba(0,0,0,0.18)), url('${bg}')`; card.style.backgroundSize = 'cover'; card.style.backgroundPosition = 'center'; } catch(e) { card.style.backgroundColor = '#2b6cb0'; }

          const txt = document.createElement('div');
          txt.style.padding = '12px';
          txt.style.zIndex = '2';
          txt.innerHTML = `<div style="font-weight:700;font-size:18px;text-shadow:0 1px 2px rgba(0,0,0,0.6)">${a.airline || 'Airline'}</div><div style="margin-top:6px;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,0.6)">${data.currency || '$'} ${a.price || '-'}</div>`;

          const bookBtn = document.createElement('button');
          bookBtn.type = 'button';
          bookBtn.textContent = 'Book';
          bookBtn.className = 'btn';
          bookBtn.style.position = 'absolute';
          bookBtn.style.right = '12px';
          bookBtn.style.top = '12px';
          bookBtn.style.zIndex = '3';
          bookBtn.style.background = 'rgba(255,255,255,0.95)';
          bookBtn.style.color = '#111';
          bookBtn.style.border = 'none';
          bookBtn.style.padding = '6px 10px';
          bookBtn.style.borderRadius = '6px';
          bookBtn.addEventListener('click', (ev) => { ev.preventDefault(); ev.stopPropagation(); if (href && href !== '#') window.open(href, '_blank'); });

          card.appendChild(txt);
          card.appendChild(bookBtn);
          tabs.appendChild(card);
        });

        c.appendChild(tabs);
        return;
      } catch (err) { c.innerText = 'Failed to render alternatives.'; }
    }

    if (data.airlines && data.airlines.length) {
      data.airlines.forEach(a => {
        const airlineBox = document.createElement('div');
        airlineBox.className = 'airline-box';

        const title = document.createElement('div');
        title.style.display = 'flex';
        title.style.alignItems = 'center';

        const logoImg = document.createElement('img');
        logoImg.src = (a.flights && a.flights[0] && a.flights[0].logo_url) || `https://ui-avatars.com/api/?name=${encodeURIComponent(a.airline)}&size=48`;
        logoImg.width = 48; logoImg.height = 48; logoImg.style.marginRight = '8px';
        title.appendChild(logoImg);

        const ttxt = document.createElement('div');
        ttxt.innerHTML = `<strong>${a.airline}</strong>`;
        title.appendChild(ttxt);

        airlineBox.appendChild(title);

        // flights table
        const table = document.createElement('table');
        table.style.width = '100%';
        table.style.borderCollapse = 'collapse';
        table.style.marginTop = '8px';
        const thead = document.createElement('thead');
        thead.innerHTML = '<tr><th style="text-align:left">Flight</th><th style="text-align:left">Time</th><th style="text-align:left">Aircraft</th><th style="text-align:left">Price</th><th></th></tr>';
        table.appendChild(thead);

        const tbody = document.createElement('tbody');
        (a.flights || []).forEach(f => {
          const tr = document.createElement('tr');
          tr.style.borderTop = '1px solid #f0f0f0';
          tr.innerHTML = `
            <td style="padding:8px 4px">${f.flight}</td>
            <td style="padding:8px 4px">${f.time || 'N/A'}</td>
            <td style="padding:8px 4px">${f.aircraft || '—'}</td>
            <td style="padding:8px 4px">${data.currency} ${f.price}</td>
            <td style="padding:8px 4px"><button type="button" class="show-dates-btn" data-flight='${encodeURIComponent(JSON.stringify(f))}'>Dates</button></td>
          `;
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        airlineBox.appendChild(table);

        const datesPanel = document.createElement('div');
        datesPanel.className = 'dates-panel';
        datesPanel.style.marginTop = '8px';
        airlineBox.appendChild(datesPanel);

        c.appendChild(airlineBox);
      });

      // attach handlers for Dates buttons
      c.querySelectorAll('.show-dates-btn').forEach(btn => {
        btn.addEventListener('click', (ev) => {
          const raw = decodeURIComponent(btn.getAttribute('data-flight') || '{}');
          let flightObj = {};
          try { flightObj = JSON.parse(raw); } catch(e) { flightObj = {}; }
          const parent = btn.closest('.airline-box');
          const panel = parent.querySelector('.dates-panel');
          panel.innerHTML = '';

          const dateOffers = flightObj.date_offers || {};
          if (!dateOffers || Object.keys(dateOffers).length === 0) {
            panel.innerText = 'No date offers available for this flight.';
            return;
          }

          const grid = document.createElement('div');
          grid.style.display = 'flex';
          grid.style.flexWrap = 'wrap';
          Object.keys(dateOffers).slice(0, 60).forEach(d => {
            const v = dateOffers[d];
            const tile = document.createElement('a');
            tile.href = v.booking_url || (flightObj.booking_url_template ? flightObj.booking_url_template.replace('{date}', encodeURIComponent(d)) : '#');
            tile.target = '_blank';
            tile.style.display = 'inline-block';
            tile.style.margin = '4px';
            tile.style.padding = '6px 8px';
            tile.style.borderRadius = '6px';
            tile.style.background = v.available ? '#e6ffed' : '#fff5f5';
            tile.style.textDecoration = 'none';
            tile.style.color = '#111';
            tile.innerText = `${d}: ${data.currency} ${v.price}${v.available ? '' : ' (sold)'} `;
            grid.appendChild(tile);
          });
          panel.appendChild(grid);
        });
      });
    } else {
      c.innerText = 'No offers available for this route.';
    }
  }

  // Simple flights list using /api/flights for consistency
  async function loadAllFlights(origin, dest, date){
    const params = new URLSearchParams();
    if (origin) params.set('origin', origin.toUpperCase());
    if (dest) params.set('destination', dest.toUpperCase());
    if (date) params.set('date', date);
    const res = await fetch('/api/flights?' + params.toString());
    if (!res.ok) throw new Error('Flights request failed: ' + res.status);
    return res.json();
  }

  function renderFlights(data){
    const c = document.getElementById('flights-container');
    c.innerHTML = '<h3>Available flights</h3>';
    const flights = (data && data.flights) ? data.flights : [];
    if (!flights.length){ c.innerHTML += '<div>No flights found.</div>'; return; }
    const tbl = document.createElement('table'); tbl.style.width='100%'; tbl.style.borderCollapse='collapse';
    const thead = document.createElement('thead'); thead.innerHTML = '<tr><th align="left">Flight</th><th align="left">Airline</th><th align="left">Route</th><th align="left">Date</th><th align="left">Depart</th><th align="left">Classes</th></tr>';
    const tbody = document.createElement('tbody');
    flights.forEach(f => {
      const depart = (f.departure_time||'').replace('T',' ').replace('Z','');
      const classes = (f.classes||[]).map(c => `${c.name} $${c.price}`).join(', ');
      const tr = document.createElement('tr'); tr.innerHTML = `<td>${f.flight}</td><td>${f.airline||''}</td><td>${f.origin} → ${f.destination}</td><td>${f.date||''}</td><td>${depart}</td><td>${classes}</td>`;
      tbody.appendChild(tr);
    });
    tbl.appendChild(thead); tbl.appendChild(tbody);
    c.appendChild(tbl);
  }

  async function fetchOffers(origin, dest, start, end) {
    const params = new URLSearchParams();
    params.set('from', origin);
    params.set('to', dest);
    if (start) params.set('start', start);
    if (end) params.set('end', end);
    const url = '/api/prices/offers?' + params.toString();
    const res = await fetch(url);
    if (!res.ok) throw new Error('Offers request failed: ' + res.status);
    return res.json();
  }

  function attachSearchHandler() {
    const btn = document.getElementById('searchBtn');
    if (!btn) return;
    btn.addEventListener('click', async (e) => {
      e.preventDefault();
      const origin = (document.getElementById('originInput') || {}).value || '';
      const dest = (document.getElementById('destInput') || {}).value || '';
      const start = (document.getElementById('startInput') || {}).value || '';
      const end = (document.getElementById('endInput') || {}).value || '';
      if (!origin || !dest) {
        alert('Please enter origin and destination codes.');
        return;
      }
      const cont = document.getElementById('offers-container');
      cont.innerHTML = 'Loading offers…';
      try {
        const data = await fetchOffers(origin, dest, start, end);
        renderOffers(data);
        // Load flights list alongside offers
        const flightsData = await loadAllFlights(origin, dest, start || '');
        renderFlights(flightsData);
      } catch (err) {
        cont.innerText = 'Failed to load offers: ' + (err.message || err);
      }
    });
  }
  // --- Autocomplete: load airports.json and provide suggestions for origin/dest inputs
  let __airports = null;
  async function loadAirports(){
    if (__airports) return __airports;
    try{
      const res = await fetch('/assets/data/airports.json');
      if (!res.ok) throw new Error('Failed to fetch airports');
      const data = await res.json();
      // normalize to objects with name, city, iata
      __airports = (Array.isArray(data) ? data : []).map(a=>({ name: a.name||a.airport||'', city: a.city||'', iata: (a.iata||a.code||'').toUpperCase() })).filter(x=>x.iata || x.name);
      return __airports;
    }catch(e){ console.debug('airports load failed', e); __airports = []; return __airports; }
  }

  function buildSuggEl(){ const el = document.createElement('div'); el.className='airport-sugg'; el.setAttribute('role','listbox'); el.style.display='none'; return el; }

  function renderSuggestions(container, items){
    container.innerHTML = '';
    if (!items || !items.length){ container.style.display='none'; return; }
    items.slice(0,50).forEach(it=>{
      const div = document.createElement('div'); div.className='item'; div.setAttribute('role','option');
      div.textContent = (it.city ? (it.city + ' ') : '') + (it.name ? (' — ' + it.name) : '') + (it.iata ? (' ('+it.iata+')') : '');
      div.dataset.iata = it.iata || '';
      div.dataset.display = div.textContent;
      container.appendChild(div);
    });
    container.style.display = 'block';
  }

  function filterAirports(q){
    try{
      if (!__airports) return [];
      const qq = (q||'').toString().trim().toLowerCase();
      if (!qq) return __airports.slice(0,20);
      const byIata = __airports.filter(a => (a.iata||'').toLowerCase().indexOf(qq) === 0);
      const byCity = __airports.filter(a => (a.city||'').toLowerCase().indexOf(qq) !== -1 && (!byIata.includes(a)));
      const byName = __airports.filter(a => (a.name||'').toLowerCase().indexOf(qq) !== -1 && (!byIata.includes(a)) && (!byCity.includes(a)));
      return byIata.concat(byCity).concat(byName).slice(0,50);
    }catch(e){ return []; }
  }

  function attachAutocomplete(inputId){
    const input = document.getElementById(inputId);
    if (!input) return;
    // wrap input to allow absolute-positioned dropdown
    if (!input.classList.contains('airport-field')) input.classList.add('airport-field');
    const container = buildSuggEl();
    input.parentNode.insertBefore(container, input.nextSibling);

    let items = [];
    let selectedIndex = -1;

    async function refresh(q){
      await loadAirports();
      items = filterAirports(q);
      renderSuggestions(container, items);
      selectedIndex = -1;
    }

    input.addEventListener('focus', function(){ refresh(input.value || ''); });
    input.addEventListener('input', function(){ refresh(input.value || ''); });
    input.addEventListener('blur', function(){ setTimeout(()=>{ container.style.display='none'; }, 180); });

    input.addEventListener('keydown', function(ev){
      if (container.style.display === 'none') return;
      const nodes = Array.from(container.querySelectorAll('.item'));
      if (ev.key === 'ArrowDown'){
        ev.preventDefault(); selectedIndex = Math.min(nodes.length-1, selectedIndex+1);
        nodes.forEach(n=>n.classList.remove('active')); if (nodes[selectedIndex]) nodes[selectedIndex].classList.add('active');
      } else if (ev.key === 'ArrowUp'){
        ev.preventDefault(); selectedIndex = Math.max(0, selectedIndex-1);
        nodes.forEach(n=>n.classList.remove('active')); if (nodes[selectedIndex]) nodes[selectedIndex].classList.add('active');
      } else if (ev.key === 'Enter'){
        if (selectedIndex >=0){ ev.preventDefault(); const n = nodes[selectedIndex]; if (n) { input.value = n.dataset.iata || n.dataset.display || n.textContent; input.dataset.selected = 'true'; input.dataset.iata = (n.dataset.iata||''); container.style.display='none'; } }
      } else if (ev.key === 'Escape'){
        container.style.display='none';
      }
    });

    container.addEventListener('mousedown', function(ev){ // use mousedown so it fires before blur
      const it = ev.target.closest('.item'); if (!it) return; ev.preventDefault(); input.value = it.dataset.iata || it.dataset.display || it.textContent; input.dataset.selected='true'; input.dataset.iata = (it.dataset.iata||''); container.style.display='none'; input.focus();
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    attachSearchHandler();
    // wire autocomplete for origin and destination
    attachAutocomplete('originInput');
    attachAutocomplete('destInput');
  });

  // TEMP DEBUG OVERLAY: shows airports load status and suggestion elements
  (function(){
    function makeOverlay(){
      const o = document.createElement('div');
      o.id = 'smf-debug-overlay';
      o.style.position = 'fixed';
      o.style.right = '12px';
      o.style.bottom = '12px';
      o.style.zIndex = '99999';
      o.style.background = 'rgba(4,18,30,0.92)';
      o.style.color = '#fff';
      o.style.padding = '10px 12px';
      o.style.borderRadius = '8px';
      o.style.fontSize = '13px';
      o.style.fontFamily = 'Arial,Helvetica,sans-serif';
      o.style.maxWidth = '320px';
      o.style.boxShadow = '0 6px 20px rgba(0,0,0,0.3)';
      o.innerHTML = '<div style="font-weight:700;margin-bottom:6px">SMF Debug</div><div id="smf-debug-body">initializing…</div><div style="margin-top:8px;text-align:right"><button id="smf-debug-close" style="background:#fff;border:none;padding:6px 8px;border-radius:6px;cursor:pointer">Close</button></div>';
      document.body.appendChild(o);
      document.getElementById('smf-debug-close').addEventListener('click', ()=>{ o.parentNode && o.parentNode.removeChild(o); });
      return o;
    }
    async function updateOverlay(o){
      try{
        const body = o.querySelector('#smf-debug-body');
        body.textContent = 'loading airports...';
        let count = 0; try{ const a = await (await fetch('/assets/data/airports.json')).json(); if (Array.isArray(a)) count = a.length; }catch(e){ body.textContent = 'airports fetch failed: '+(e && e.message?e.message:'err'); }
        const suggs = document.querySelectorAll('.airport-sugg');
        const info = [];
        info.push('airports: ' + count);
        info.push('suggestion elements: ' + suggs.length);
        if (suggs.length){ suggs.forEach((s,i)=>{ const disp = window.getComputedStyle(s).display; info.push('sugg['+i+'] display='+disp+' items='+s.querySelectorAll('.item').length); }); }
        // also check origin/dest inputs
        const oIn = document.getElementById('originInput'); const dIn = document.getElementById('destInput');
        info.push('origin value="' + (oIn?oIn.value:'(missing)') + '"');
        info.push('dest value="' + (dIn?dIn.value:'(missing)') + '"');
        body.innerHTML = info.map(i=>'&middot; '+i).join('<br>');
      }catch(e){ try{ o.querySelector('#smf-debug-body').textContent = 'overlay error: '+e.message; }catch(_){}}
    }
    window.addEventListener('load', function(){ try{ const ov = makeOverlay(); setTimeout(()=>updateOverlay(ov), 300); setTimeout(()=>updateOverlay(ov), 1200); }catch(e){} });
  })();
  </script>
</body>
</html>
