<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Your Flight - SmartFly Airways</title>
    <link rel="stylesheet" href="/availability.css">
    <style>
        /* Minimal inline styles for backward compatibility */
        body { margin: 0; }
    </style>
</head>
<body>
    <!-- Sticky Summary Bar -->
    <div class="summary-bar">
        <div class="summary-container">
            <div class="summary-route">
                <div class="route-segment">
                    <span class="airport-code" id="fromCode">NBO</span>
                    <span class="city-name" id="fromCity">Nairobi</span>
                </div>
                <div class="route-arrow">→</div>
                <div class="route-segment">
                    <span class="airport-code" id="toCode">LHR</span>
                    <span class="city-name" id="toCity">London</span>
                </div>
            </div>
            <div class="summary-details">
                <span id="travelDates">Jan 28 - Feb 5</span>
                <span class="detail-separator">•</span>
                <span id="passengerCount">1 Adult</span>
            </div>
            <div class="summary-booking">
                <button class="booking-icon-btn">
                    <span class="booking-icon">🧳</span>
                    <span>Your Booking</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Date Price Slider -->
        <div class="date-slider-section">
            <button class="date-nav-btn" id="prevDate">‹</button>
            <div class="date-slider" id="dateSlider">
                <!-- Date cards will be inserted here by JavaScript -->
            </div>
            <button class="date-nav-btn" id="nextDate">›</button>
        </div>

        <!-- Filters & Sort Bar -->
        <div class="filters-sort-bar">
            <div class="filters-section">
                <button class="filters-btn">
                    <span class="filter-icon">🔧</span>
                    <span>Filters</span>
                </button>
                <span class="results-count" id="resultsCount">Loading...</span>
            </div>
            <div class="sort-section">
                <label for="sortSelect">Sort by:</label>
                <select id="sortSelect">
                    <option value="recommended">Recommended</option>
                    <option value="cheapest">Cheapest</option>
                    <option value="fastest">Fastest</option>
                    <option value="earliest">Earliest</option>
                    <option value="latest">Latest</option>
                </select>
            </div>
        </div>

        <!-- Flight Results -->
        <div class="flight-results" id="flightResults">
            <!-- Flight cards will be inserted here by JavaScript -->
        </div>
    </div>

    <script src="/availability.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const params = new URLSearchParams(window.location.search);

            const origin = params.get('origin');
            const destination = params.get('destination');
            const departure = params.get('departure');
            const returnDate = params.get('return');
            const passengers = params.get('passengers'); // e.g., "1-0-0"

            // --- Update Summary Bar ---
            if (origin) document.getElementById('fromCode').textContent = origin;
            if (destination) document.getElementById('toCode').textContent = destination;

            const travelDatesEl = document.getElementById('travelDates');
            if (departure && returnDate) {
                travelDatesEl.textContent = `${formatDisplayDate(departure)} - ${formatDisplayDate(returnDate)}`;
            } else if (departure) {
                travelDatesEl.textContent = formatDisplayDate(departure);
            }

            const passengerCountEl = document.getElementById('passengerCount');
            if (passengers) {
                const [adults, children, infants] = passengers.split('-').map(Number);
                let text = `${adults} Adult${adults > 1 ? 's' : ''}`;
                if (children > 0) text += `, ${children} Child${children > 1 ? 'ren' : ''}`;
                if (infants > 0) text += `, ${infants} Infant${infants > 1 ? 's' : ''}`;
                passengerCountEl.textContent = text;
            }

            console.log('Page loaded for flight search:', { origin, destination, departure, returnDate, passengers });
        });

        function formatDisplayDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            const adjustedDate = new Date(date.getTime() + date.getTimezoneOffset() * 60000);
            return adjustedDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }
    </script>
</body>
</html>
