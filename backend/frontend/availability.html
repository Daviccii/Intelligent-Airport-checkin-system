<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Your Flight - SmartFly Airways</title>
    <link rel="stylesheet" href="/availability.css">
    <style>
        /* Minimal inline styles for backward compatibility */
        body { margin: 0; }
    </style>
</head>
<body>
    <!-- Sticky Summary Bar -->
    <div class="summary-bar">
        <div class="summary-container">
            <div class="summary-route">
                <div class="route-segment">
                    <span class="airport-code" id="fromCode">NBO</span>
                    <span class="city-name" id="fromCity">Nairobi</span>
                </div>
                <div class="route-arrow">→</div>
                <div class="route-segment">
                    <span class="airport-code" id="toCode">LHR</span>
                    <span class="city-name" id="toCity">London</span>
                </div>
            </div>
            <div class="summary-details">
                <span id="travelDates">Jan 28 - Feb 5</span>
                <span class="detail-separator">•</span>
                <span id="passengerCount">1 Adult</span>
            </div>
            <div class="summary-booking">
                <button class="booking-icon-btn">
                    <span class="booking-icon">🧳</span>
                    <span>Your Booking</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Date Price Slider -->
        <div class="date-slider-section">
            <button class="date-nav-btn" id="prevDate">‹</button>
            <div class="date-slider" id="dateSlider">
                <!-- Date cards will be inserted here by JavaScript -->
            </div>
            <button class="date-nav-btn" id="nextDate">›</button>
        </div>

        <!-- Filters & Sort Bar -->
        <div class="filters-sort-bar">
            <div class="filters-section">
                <button class="filters-btn">
                    <span class="filter-icon">🔧</span>
                    <span>Filters</span>
                </button>
                <span class="results-count" id="resultsCount">Loading...</span>
            </div>
            <div class="sort-section">
                <label for="sortSelect">Sort by:</label>
                <select id="sortSelect">
                    <option value="recommended">Recommended</option>
                    <option value="cheapest">Cheapest</option>
                    <option value="fastest">Fastest</option>
                    <option value="earliest">Earliest</option>
                    <option value="latest">Latest</option>
                </select>
            </div>
        </div>

        <!-- Flight Results -->
        <div class="flight-results" id="flightResults">
            <!-- Flight cards will be inserted here by JavaScript -->
        </div>
    </div>

    <script src="/availability.js"></script>
</body>
</html>
